<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>QR Scanner v0.10</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #172033;
}

main {
  max-width: 720px;
  margin: 0 auto;
}

h2 {
  margin: 3px 0 12px;
  font-size: 21px;
}

input, button {
  font: inherit;
}

button {
  min-height: 44px;
  padding: 10px 7px;
  border: 1px solid #c8ced8;
  border-radius: 8px;
  background: white;
  color: #172033;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#name {
  width: 100%;
  min-height: 46px;
  margin-bottom: 8px;
  padding: 9px;
  border: 1px solid #c8ced8;
  border-radius: 8px;
  background: white;
  font-size: 19px;
}

#snd {
  width: 100%;
  margin-bottom: 9px;
}

#wrap {
  position: relative;
  width: 100%;
  min-height: 180px;
  overflow: hidden;
  border-radius: 10px;
  background: #080b10;
}

#v {
  display: block;
  width: 100%;
  max-height: 58vh;
  object-fit: contain;
}

#aim {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 10px;
  pointer-events: none;
}

#startBtn {
  display: none;
  width: 100%;
  margin: 8px 0;
}

#zoomBox {
  display: none;
  margin: 10px 2px;
  padding: 9px;
  border-radius: 8px;
  background: white;
  font-size: 16px;
}

#zoom {
  width: 72%;
  vertical-align: middle;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-top: 9px;
}

#out {
  min-height: 52px;
  margin: 12px 0 6px;
  padding: 10px;
  border-radius: 8px;
  background: white;
  font-size: 18px;
  line-height: 1.45;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

#info {
  min-height: 36px;
  margin: 6px 2px;
  color: #5d6675;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.tip {
  margin: 10px 2px;
  color: #697386;
  font-size: 12px;
  line-height: 1.5;
}

footer {
  margin: 22px 2px 4px;
  color: #8a93a2;
  text-align: right;
  font-size: 11px;
}

@media (max-width: 420px) {
  body { padding: 10px; }
}
</style>
</head>

<body>
<main>

<h2>배터리 QR 스캐너</h2>

<input
  id="name"
  type="text"
  autocomplete="name"
  placeholder="작업자 이름 입력"
>

<button id="snd" type="button">
  🔊 소리 켜기 (한 번 누르세요)
</button>

<div id="wrap">
  <video id="v" playsinline muted autoplay></video>
  <div id="aim"></div>
</div>

<button id="startBtn" type="button">
  📷 카메라 시작
</button>

<div id="zoomBox">
  🔍 카메라 확대
  <input id="zoom" type="range" min="1" max="1" step="0.1" value="1">
  <span id="zoomVal">1.0×</span>
</div>

<div class="controls">
  <button id="resBtn" type="button">📐 해상도: 1080p</button>
  <button id="camBtn" type="button" disabled>🔄 카메라 전환</button>
  <button id="shot" type="button">📷 사진으로 스캔</button>
</div>

<input
  id="file"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
>

<p id="out" role="status" aria-live="polite">
  카메라를 준비하고 있습니다.
</p>

<p id="info"></p>

<p class="tip">
  QR 코드를 화면 중앙에 맞추면 인식에 유리합니다.
  중앙에서 벗어난 QR도 전체 화면을 먼저 탐색합니다.
</p>

<footer>ver0.10 / by KDH</footer>

</main>

<script>
'use strict';


/* ==================================================
   1. 기본 설정
================================================== */

const URL_ =
  'https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec';

const TOKEN = '1111';

const $ = id => document.getElementById(id);

const video = $('v');
const out = $('out');
const info = $('info');
const nameEl = $('name');
const snd = $('snd');

const startBtn = $('startBtn');
const resBtn = $('resBtn');
const camBtn = $('camBtn');
const shot = $('shot');
const fileEl = $('file');

const zoomBox = $('zoomBox');
const zoomEl = $('zoom');
const zoomVal = $('zoomVal');


/* ==================================================
   2. 오류 표시
================================================== */

window.addEventListener('error', e => {
  out.textContent =
    '오류: ' + (e.message || '알 수 없는 오류');
});

window.addEventListener('unhandledrejection', e => {
  const message =
    e.reason && e.reason.message
      ? e.reason.message
      : String(e.reason || '알 수 없는 오류');

  info.textContent = '처리 중 오류: ' + message;
});


/* ==================================================
   3. QR 인식 엔진 불러오기
   ZXing-WASM + BarcodeDetector
================================================== */

let zxStatus = '불러오는 중';
let bd = null;

const ZX_URLS = [

  'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.1/dist/iife/reader/index.js',

  'https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.0/dist/iife/reader/index.js'

];


function loadZx(index) {

  return new Promise(resolve => {

    if (
      window.ZXingWASM &&
      typeof window.ZXingWASM.readBarcodes === 'function'
    ) {

      zxStatus = '준비됨';
      resolve(true);
      return;

    }


    if (index >= ZX_URLS.length) {

      zxStatus = '불러오기 실패';
      resolve(false);
      return;

    }


    const script = document.createElement('script');

    script.src = ZX_URLS[index];

    script.onload = () => {

      if (
        window.ZXingWASM &&
        typeof window.ZXingWASM.readBarcodes === 'function'
      ) {

        zxStatus = '준비됨';
        resolve(true);

      } else {

        script.remove();
        loadZx(index + 1).then(resolve);

      }

    };


    script.onerror = () => {

      script.remove();
      loadZx(index + 1).then(resolve);

    };


    document.head.appendChild(script);

  });

}


const zxReady = loadZx(0);


// 브라우저 내장 QR 인식기
try {

  if ('BarcodeDetector' in window) {

    bd = new BarcodeDetector({
      formats: ['qr_code']
    });

  }

} catch(e) {

  bd = null;

}


/* ==================================================
   4. ZXing-WASM 인식
================================================== */

async function zxRead(imageData) {

  if (
    !window.ZXingWASM ||
    typeof window.ZXingWASM.readBarcodes !== 'function'
  ) {
    return null;
  }


  try {

    const results =
      await window.ZXingWASM.readBarcodes(
        imageData,
        {
          formats: ['QRCode'],
          tryHarder: true,
          tryRotate: true,
          tryInvert: true,
          tryDownscale: true,
          maxNumberOfSymbols: 1
        }
      );


    const hit = results.find(
      item => item.text && item.isValid !== false
    );


    if (hit) {
      zxStatus = '정상';
      return hit.text;
    }

    zxStatus = '탐색 중';

    return null;

  } catch(e) {

    zxStatus =
      '오류: ' +
      (e && e.message ? e.message : String(e));

    return null;

  }

}


/* ==================================================
   5. 흑백 변환 및 명암 보정
   - 밝기 차이 확대
   - 흑백 변환
   - 색상 반전
================================================== */

function enhanceImageData(imageData, invert) {

  const source = imageData.data;

  const width = imageData.width;
  const height = imageData.height;

  const count = width * height;

  const gray = new Uint8Array(count);
  const histogram = new Uint32Array(256);


  // RGB → 흑백 명암값 변환
  for (let i = 0, j = 0; i < count; i++, j += 4) {

    const value =
      (source[j] * 77 +
       source[j + 1] * 150 +
       source[j + 2] * 29) >> 8;

    gray[i] = value;

    histogram[value]++;

  }


  // 밝기 하위 2%, 상위 2% 기준
  const lowerTarget = count * 0.02;
  const upperTarget = count * 0.98;

  let lower = 0;
  let upper = 255;

  let acc = 0;


  for (let i = 0; i < 256; i++) {

    acc += histogram[i];

    if (acc >= lowerTarget) {
      lower = i;
      break;
    }

  }


  acc = 0;

  for (let i = 255; i >= 0; i--) {

    acc += histogram[i];

    if (acc >= count - upperTarget) {
      upper = i;
      break;
    }

  }


  const range = Math.max(1, upper - lower);

  const output = new Uint8ClampedArray(source.length);


  // 대비 확대 및 색상 반전
  for (let i = 0, j = 0; i < count; i++, j += 4) {

    let value =
      (gray[i] - lower) * 255 / range;

    value = Math.max(0, Math.min(255, value));

    if (invert) {
      value = 255 - value;
    }

    output[j] = value;
    output[j + 1] = value;
    output[j + 2] = value;
    output[j + 3] = 255;

  }


  return new ImageData(output, width, height);

}


/* ==================================================
   6. 이미지 분석
   1차: 원본 이미지
   2차: 명암 보정 이미지
   3차: 색상 반전 이미지
================================================== */

async function decodeCanvas(canvas, mode = 'normal') {

  const ctx = canvas.getContext('2d', {
    willReadFrequently: true
  });


  // 원본 이미지 내장 인식기
  if (mode === 'normal' && bd) {

    try {

      const results = await bd.detect(canvas);

      const hit = results.find(item => item.rawValue);

      if (hit) {
        return hit.rawValue;
      }

    } catch(e) {}

  }


  const original =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  // 원본 이미지 분석
  if (mode === 'normal') {

    const hit = await zxRead(original);

    if (hit) return hit;

    return null;

  }


  // 명암 보정 이미지 분석
  const enhanced =
    enhanceImageData(original, false);

  let hit = await zxRead(enhanced);

  if (hit) return hit;


  // 색상 반전 이미지 분석
  const inverted =
    enhanceImageData(original, true);

  hit = await zxRead(inverted);

  if (hit) return hit;


  return null;

}


/* ==================================================
   7. 소리 및 진동
================================================== */

let audioContext = null;


function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    if (audioContext.state === 'suspended') {
      audioContext.resume().catch(() => {});
    }

  } catch(e) {}

}


function beep(frequency, duration) {

  try {

    unlockAudio();

    if (!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = 'square';

    oscillator.frequency.value = frequency;

    gain.gain.value = 0.16;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + duration
    );

  } catch(e) {}

}


snd.addEventListener('click', () => {

  unlockAudio();

  beep(1200, 0.12);

  snd.textContent = '🔊 소리 켜짐';

});


/* ==================================================
   8. 작업자 이름 저장
================================================== */

try {

  nameEl.value =
    localStorage.getItem('worker') || '';

} catch(e) {}


nameEl.addEventListener('input', () => {

  try {

    localStorage.setItem(
      'worker',
      nameEl.value.trim()
    );

  } catch(e) {}


  // 작업자 이름 입력 후 현재 QR 재인식 허용
  lastText = '';
  lastSeen = 0;

});


/* ==================================================
   9. Google Sheets 전송
================================================== */

let busy = false;


async function handleScan(text) {

  if (busy) return false;


  const workerName = nameEl.value.trim();


  if (!workerName) {

    beep(300, 0.28);

    out.textContent =
      '작업자 이름을 먼저 입력하세요.';

    return false;

  }


  busy = true;

  beep(1200, 0.12);


  try {

    if (navigator.vibrate) {
      navigator.vibrate(80);
    }

  } catch(e) {}


  // 원본 QR 데이터의 51~63번째 문자 추출
  const extracted = text.substring(50, 63);


  out.textContent =
    '인식 데이터: ' + extracted +
    '\nGoogle Sheets 전송 요청 중...';


  try {

    await fetch(URL_, {

      method: 'POST',

      mode: 'no-cors',

      headers: {
        'Content-Type': 'text/plain'
      },

      body: JSON.stringify({

        token: TOKEN,

        text: text,

        name: workerName

      })

    });


    // 클립보드 복사
    try {

      await navigator.clipboard.writeText(extracted);

    } catch(e) {}


    out.textContent =
      '인식 데이터: ' + extracted +
      '\n전송 요청 완료 (스프레드시트 등록 여부 확인 필요)';


  } catch(e) {

    out.textContent =
      '전송 요청 실패: ' +
      (e.message || String(e));

  }


  setTimeout(() => {
    busy = false;
  }, 1500);


  return true;

}


/* ==================================================
   10. 해상도 설정
================================================== */

const LEVELS = [

  { name: '1080p', width: 1920, height: 1080 },

  { name: '4K', width: 3840, height: 2160 },

  { name: '720p', width: 1280, height: 720 }

];


let levelIndex = 0;


try {

  const current =
    localStorage.getItem('cameraLevel');

  if (current !== null) {

    const saved = parseInt(current, 10);

    if (saved >= 0 && saved < LEVELS.length) {
      levelIndex = saved;
    }

  } else {

    // 첨부 v0.9의 해상도 순서와 호환
    const old = localStorage.getItem('lv2');

    if (old !== null) {

      const oldValue = parseInt(old, 10);

      if (oldValue === 0) levelIndex = 1;
      else if (oldValue === 1) levelIndex = 0;
      else if (oldValue === 2) levelIndex = 2;

    }

  }

} catch(e) {}


resBtn.textContent =
  '📐 해상도: ' + LEVELS[levelIndex].name;


/* ==================================================
   11. 카메라 상태 변수
================================================== */

const inApp =
  /KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram|DaumApps/i
  .test(navigator.userAgent);


let stream = null;
let track = null;

let running = false;
let starting = false;
let scanning = false;

let decodingPhoto = false;
let pickerOpen = false;

let selectedDeviceId = '';
let cameras = [];

let cameraName = '카메라';

let loopTimer = null;

let lastText = '';
let lastSeen = 0;

let frameCount = 0;


/* ==================================================
   12. 카메라 정지
================================================== */

function stopCamera() {

  running = false;

  clearTimeout(loopTimer);

  loopTimer = null;


  if (stream) {

    stream.getTracks().forEach(
      mediaTrack => mediaTrack.stop()
    );

  }


  stream = null;
  track = null;

  video.pause();

  video.srcObject = null;

  zoomBox.style.display = 'none';

}


/* ==================================================
   13. 카메라 오류 안내
================================================== */

function showCamError(error) {

  const errorName =
    error && error.name ? error.name : '';

  let message =
    '카메라를 열 수 없습니다' +
    (errorName ? ' (' + errorName + ')' : '');


  if (
    errorName === 'NotAllowedError' ||
    errorName === 'SecurityError'
  ) {

    message =
      '카메라 권한이 거부되었습니다. ' +
      '브라우저 사이트 설정에서 카메라를 허용해 주세요. ' +
      '(아이폰: 설정 > Safari > 카메라)';

  } else if (
    errorName === 'NotFoundError'
  ) {

    message = '사용 가능한 카메라를 찾을 수 없습니다.';

  } else if (
    errorName === 'NotReadableError'
  ) {

    message =
      '다른 앱이 카메라를 사용 중일 수 있습니다.';

  } else if (
    errorName === 'OverconstrainedError'
  ) {

    message =
      '요청한 카메라 또는 해상도를 사용할 수 없습니다.';

  }


  if (inApp) {

    message +=
      ' 앱 내부 브라우저라면 Safari 또는 Chrome에서 열어 주세요.';

  }


  out.textContent = message;

}


/* ==================================================
   14. 카메라 목록 확인
================================================== */

async function refreshCameraList() {

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameras = devices.filter(
      device => device.kind === 'videoinput'
    );


    if (track && track.getSettings) {

      const settings = track.getSettings();

      if (settings.deviceId) {
        selectedDeviceId = settings.deviceId;
      }

    }


    const current = cameras.find(
      device => device.deviceId === selectedDeviceId
    );


    cameraName =
      current && current.label
        ? current.label
        : '선택된 카메라';


    camBtn.textContent =
      cameras.length > 1
        ? '🔄 카메라 전환 (' + cameras.length + ')'
        : '📷 카메라 1대';


    camBtn.disabled = cameras.length < 2;

  } catch(e) {

    cameras = [];

    camBtn.disabled = true;

    camBtn.textContent = '🔄 카메라 전환';

  }

}


/* ==================================================
   15. 자동 초점 및 줌
================================================== */

async function setupTrack() {

  if (!track) return;


  let caps = {};
  let settings = {};


  try {

    caps = track.getCapabilities
      ? track.getCapabilities()
      : {};

  } catch(e) {}


  try {

    settings = track.getSettings
      ? track.getSettings()
      : {};

  } catch(e) {}


  // 연속 자동 초점
  try {

    if (
      Array.isArray(caps.focusMode) &&
      caps.focusMode.includes('continuous')
    ) {

      await track.applyConstraints({

        advanced: [
          { focusMode: 'continuous' }
        ]

      });

    }

  } catch(e) {}


  // 카메라 줌
  zoomBox.style.display = 'none';


  try {

    if (caps.zoom) {

      zoomEl.min = caps.zoom.min;

      zoomEl.max = caps.zoom.max;

      zoomEl.step = caps.zoom.step || 0.1;

      zoomEl.value =
        settings.zoom || caps.zoom.min;


      zoomVal.textContent =
        Number(zoomEl.value).toFixed(1) + '×';


      zoomEl.oninput = async () => {

        if (!track) return;

        const value = parseFloat(zoomEl.value);

        zoomVal.textContent =
          value.toFixed(1) + '×';


        try {

          await track.applyConstraints({

            advanced: [
              { zoom: value }
            ]

          });

        } catch(e) {}

      };


      zoomBox.style.display = 'block';

    }

  } catch(e) {}

}


/* ==================================================
   16. 카메라 시작
================================================== */

async function startCamera(deviceId) {

  if (starting) return false;

  starting = true;

  stopCamera();

  startBtn.style.display = 'none';


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      out.textContent =
        '이 브라우저는 카메라를 지원하지 않습니다. ' +
        '사진으로 스캔을 사용해 주세요.';

      startBtn.style.display = 'block';

      return false;

    }


    const level = LEVELS[levelIndex];


    const selectors = [];


    if (deviceId) {

      selectors.push({
        deviceId: { exact: deviceId }
      });

    }


    selectors.push({
      facingMode: { ideal: 'environment' }
    });


    let lastError = null;


    // 지정 해상도 우선, 실패하면 기본 해상도 재시도
    for (const selector of selectors) {

      const attempts = [

        {
          audio: false,

          video: {
            ...selector,

            width: {
              ideal: level.width
            },

            height: {
              ideal: level.height
            }
          }
        },

        {
          audio: false,

          video: {
            ...selector
          }
        }

      ];


      for (const constraints of attempts) {

        try {

          stream =
            await navigator.mediaDevices.getUserMedia(
              constraints
            );

          lastError = null;

          break;

        } catch(error) {

          lastError = error;

        }

      }


      if (stream) break;

    }


    if (!stream) {

      throw lastError ||
        new Error('카메라 스트림을 가져오지 못했습니다.');

    }


    track = stream.getVideoTracks()[0];


    const settings =
      track.getSettings
        ? track.getSettings()
        : {};


    selectedDeviceId =
      settings.deviceId || deviceId || '';


    video.setAttribute('playsinline', '');

    video.muted = true;

    video.srcObject = stream;


    try {

      await video.play();

    } catch(e) {

      stopCamera();

      startBtn.style.display = 'block';

      out.textContent =
        '카메라 실행을 위해 아래 카메라 시작 버튼을 눌러 주세요.';

      return false;

    }


    await setupTrack();

    await refreshCameraList();


    running = true;

    out.textContent =
      'QR 코드를 비춰 주세요.';

    startBtn.style.display = 'none';

    scanLoop();

    return true;


  } catch(error) {

    stopCamera();

    showCamError(error);

    startBtn.style.display = 'block';

    return false;

  } finally {

    starting = false;

  }

}


/* ==================================================
   17. 카메라 전환
================================================== */

async function switchCamera() {

  if (starting || decodingPhoto) return;


  await refreshCameraList();


  if (cameras.length < 2) {

    out.textContent =
      '전환할 수 있는 다른 카메라가 없습니다.';

    return;

  }


  const currentIndex = cameras.findIndex(
    device => device.deviceId === selectedDeviceId
  );


  const nextIndex =
    currentIndex < 0
      ? 0
      : (currentIndex + 1) % cameras.length;


  const nextCamera = cameras[nextIndex];


  if (nextCamera.deviceId === selectedDeviceId) {
    return;
  }


  await startCamera(nextCamera.deviceId);

}


/* ==================================================
   18. 카메라 선명도 측정
   화면 중앙의 영상 선명도 참고값
================================================== */

const sharpCanvas =
  document.createElement('canvas');

sharpCanvas.width = 128;
sharpCanvas.height = 128;

const sharpCtx =
  sharpCanvas.getContext('2d', {
    willReadFrequently: true
  });

let sharpVal = 0;


function measureSharpness() {

  if (
    !running ||
    !video.videoWidth ||
    video.readyState < 2
  ) {
    return;
  }


  try {

    const width = video.videoWidth;
    const height = video.videoHeight;

    const size = Math.min(width, height) * 0.25;


    sharpCtx.drawImage(

      video,

      (width - size) / 2,
      (height - size) / 2,

      size,
      size,

      0,
      0,

      128,
      128

    );


    const data =
      sharpCtx.getImageData(
        0,
        0,
        128,
        128
      ).data;


    const gray = new Float32Array(128 * 128);


    for (let i = 0, j = 0; i < gray.length; i++, j += 4) {

      gray[i] =
        data[j] * 0.299 +
        data[j + 1] * 0.587 +
        data[j + 2] * 0.114;

    }


    let sum = 0;
    let sum2 = 0;
    let count = 0;


    for (let y = 1; y < 127; y++) {

      for (let x = 1; x < 127; x++) {

        const i = y * 128 + x;

        const laplacian =

          4 * gray[i] -
          gray[i - 1] -
          gray[i + 1] -
          gray[i - 128] -
          gray[i + 128];


        sum += laplacian;

        sum2 += laplacian * laplacian;

        count++;

      }

    }


    sharpVal =
      Math.max(
        0,
        sum2 / count -
        Math.pow(sum / count, 2)
      );


  } catch(e) {}

}


/* ==================================================
   19. 카메라 정보 표시
================================================== */

function updateInfo() {

  if (!running || !track) return;


  let settings = {};


  try {

    settings = track.getSettings
      ? track.getSettings()
      : {};

  } catch(e) {}


  const resolution =
    video.videoWidth +
    '×' +
    video.videoHeight;


  const fps =
    settings.frameRate
      ? ' / ' + Math.round(settings.frameRate) + 'fps'
      : '';


  const detector =
    bd ? '내장 인식기 + ' : '';


  info.textContent =

    '요청: ' +
    LEVELS[levelIndex].name +

    ' / 실제: ' +
    resolution +

    fps +

    ' / 카메라: ' +
    cameraName +

    ' / 선명도 참고값: ' +
    Math.round(sharpVal) +

    ' / 인식기: ' +
    detector +

    'ZXing-WASM(' +
    zxStatus +
    ')';

}


setInterval(() => {

  measureSharpness();

  updateInfo();

}, 1000);


/* ==================================================
   20. 영상 캡처용 캔버스
================================================== */

const frameCanvas =
  document.createElement('canvas');

const zoomCanvas =
  document.createElement('canvas');

const MAX_FRAME_PIXELS = 3500000;

const MAX_FRAME_EDGE = 3000;


const frameContext =
  frameCanvas.getContext('2d', {
    willReadFrequently: true
  });


const zoomContext =
  zoomCanvas.getContext('2d', {
    willReadFrequently: true
  });


/* ==================================================
   21. 전체 영상 캡처
   원본 영상의 전체 범위를 유지하면서 축소
================================================== */

function captureFullFrame() {

  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;


  if (!sourceWidth || !sourceHeight) {
    return false;
  }


  const scale = Math.min(

    1,

    Math.sqrt(
      MAX_FRAME_PIXELS /
      (sourceWidth * sourceHeight)
    ),

    MAX_FRAME_EDGE /
    Math.max(sourceWidth, sourceHeight)

  );


  const width =
    Math.max(1, Math.round(sourceWidth * scale));

  const height =
    Math.max(1, Math.round(sourceHeight * scale));


  if (frameCanvas.width !== width) {
    frameCanvas.width = width;
  }

  if (frameCanvas.height !== height) {
    frameCanvas.height = height;
  }


  // 영상 전체를 캔버스에 담음
  frameContext.drawImage(

    video,

    0,
    0,
    sourceWidth,
    sourceHeight,

    0,
    0,
    width,
    height

  );


  return true;

}


/* ==================================================
   22. 중앙 영역 확대 캡처
   전체 화면 분석 실패 시 추가 분석
================================================== */

function captureCenterZoom() {

  const width = frameCanvas.width;
  const height = frameCanvas.height;


  if (!width || !height) return false;


  const ratio = 0.72;

  const cropWidth =
    Math.round(width * ratio);

  const cropHeight =
    Math.round(height * ratio);

  const sx =
    Math.round((width - cropWidth) / 2);

  const sy =
    Math.round((height - cropHeight) / 2);


  if (zoomCanvas.width !== width) {
    zoomCanvas.width = width;
  }

  if (zoomCanvas.height !== height) {
    zoomCanvas.height = height;
  }


  zoomContext.drawImage(

    frameCanvas,

    sx,
    sy,
    cropWidth,
    cropHeight,

    0,
    0,
    width,
    height

  );


  return true;

}


/* ==================================================
   23. QR 인식 및 중복 방지
================================================== */

async function processDecodedText(text) {

  if (!text) return;


  const now = Date.now();


  // 같은 QR이 계속 화면에 있을 때 중복 전송 방지
  if (
    text === lastText &&
    now - lastSeen < 2500
  ) {

    lastSeen = now;

    return;

  }


  lastText = text;

  lastSeen = now;


  await handleScan(text);

}


/* ==================================================
   24. 실시간 스캔 반복
   1. 전체 화면 원본
   2. 명암 보정
   3. 중앙 확대
================================================== */

async function scanLoop() {

  if (!running) return;


  if (

    !busy &&
    !scanning &&
    !decodingPhoto &&
    video.readyState >= 2 &&
    video.videoWidth > 0

  ) {

    scanning = true;


    try {

      if (captureFullFrame()) {

        frameCount++;


        // 1단계: 전체 화면 원본 분석
        let text =
          await decodeCanvas(
            frameCanvas,
            'normal'
          );


        // 2단계: 일정 간격으로 명암 보정 분석
        if (
          !text &&
          frameCount % 3 === 0
        ) {

          text =
            await decodeCanvas(
              frameCanvas,
              'enhanced'
            );

        }


        // 3단계: 중앙 영역 확대 분석
        if (
          !text &&
          frameCount % 2 === 0
        ) {

          captureCenterZoom();

          text =
            await decodeCanvas(
              zoomCanvas,
              'normal'
            );


          // 중앙 확대 영상의 명암 보정 분석
          if (
            !text &&
            frameCount % 4 === 0
          ) {

            text =
              await decodeCanvas(
                zoomCanvas,
                'enhanced'
              );

          }

        }


        if (text) {
          await processDecodedText(text);
        }

      }

    } catch(e) {

      // 일시적인 분석 오류로 반복 스캔이 중단되지 않도록 처리

    } finally {

      scanning = false;

    }

  }


  if (running) {

    loopTimer =
      setTimeout(scanLoop, 120);

  }

}


/* ==================================================
   25. 버튼 기능
================================================== */

// 카메라 시작
startBtn.addEventListener('click', () => {

  startCamera(
    selectedDeviceId || undefined
  );

});


// 해상도 변경
resBtn.addEventListener('click', async () => {

  if (starting || decodingPhoto) return;


  levelIndex =
    (levelIndex + 1) % LEVELS.length;


  try {

    localStorage.setItem(
      'cameraLevel',
      String(levelIndex)
    );

  } catch(e) {}


  resBtn.textContent =
    '📐 해상도: ' +
    LEVELS[levelIndex].name;


  await startCamera(
    selectedDeviceId || undefined
  );

});


// 카메라 전환
camBtn.addEventListener('click', switchCamera);


/* ==================================================
   26. 사진 이미지 불러오기
================================================== */

async function loadPhoto(file) {

  if (window.createImageBitmap) {

    try {

      const bitmap =
        await createImageBitmap(file);


      return {

        source: bitmap,

        width: bitmap.width,

        height: bitmap.height,

        cleanup: () => {
          bitmap.close && bitmap.close();
        }

      };

    } catch(e) {}

  }


  const objectUrl =
    URL.createObjectURL(file);


  try {

    const image = await new Promise(
      (resolve, reject) => {

        const element = new Image();

        element.onload = () => resolve(element);

        element.onerror = reject;

        element.src = objectUrl;

      }
    );


    return {

      source: image,

      width: image.naturalWidth,

      height: image.naturalHeight,

      cleanup: () => {
        URL.revokeObjectURL(objectUrl);
      }

    };

  } catch(e) {

    URL.revokeObjectURL(objectUrl);

    throw e;

  }

}


/* ==================================================
   27. 사진의 특정 영역 캡처
================================================== */

function imageToCanvas(
  source,
  sourceWidth,
  sourceHeight,
  crop,
  maxEdge
) {

  const cropWidth =
    sourceWidth * crop.width;

  const cropHeight =
    sourceHeight * crop.height;

  const sx =
    sourceWidth * crop.x;

  const sy =
    sourceHeight * crop.y;


  const scale = Math.min(

    1,

    maxEdge /
    Math.max(cropWidth, cropHeight),

    Math.sqrt(
      6000000 /
      (cropWidth * cropHeight)
    )

  );


  const width =
    Math.max(1, Math.round(cropWidth * scale));

  const height =
    Math.max(1, Math.round(cropHeight * scale));


  const canvas =
    document.createElement('canvas');

  canvas.width = width;
  canvas.height = height;


  const context =
    canvas.getContext('2d', {
      willReadFrequently: true
    });


  context.drawImage(

    source,

    sx,
    sy,
    cropWidth,
    cropHeight,

    0,
    0,
    width,
    height

  );


  return canvas;

}


/* ==================================================
   28. 사진에서 QR 찾기
   전체 → 중앙 → 주변 영역
================================================== */

async function decodePhoto(file) {

  let photo;


  try {

    photo = await loadPhoto(file);

  } catch(e) {

    return null;

  }


  try {

    const width = photo.width;
    const height = photo.height;


    const attempts = [

      // 전체 이미지
      {
        x: 0,
        y: 0,
        width: 1,
        height: 1
      },

      // 중앙
      {
        x: 0.14,
        y: 0.14,
        width: 0.72,
        height: 0.72
      },

      // 좌측 상단
      {
        x: 0,
        y: 0,
        width: 0.7,
        height: 0.7
      },

      // 우측 상단
      {
        x: 0.3,
        y: 0,
        width: 0.7,
        height: 0.7
      },

      // 좌측 하단
      {
        x: 0,
        y: 0.3,
        width: 0.7,
        height: 0.7
      },

      // 우측 하단
      {
        x: 0.3,
        y: 0.3,
        width: 0.7,
        height: 0.7
      }

    ];


    for (const crop of attempts) {

      const canvas = imageToCanvas(

        photo.source,

        width,
        height,

        crop,

        3600

      );


      // 원본 이미지 분석
      let text =
        await decodeCanvas(
          canvas,
          'normal'
        );


      // 실패 시 명암 보정 분석
      if (!text) {

        text =
          await decodeCanvas(
            canvas,
            'enhanced'
          );

      }


      canvas.width = 1;
      canvas.height = 1;


      if (text) {
        return text;
      }

    }


    return null;


  } finally {

    if (photo.cleanup) {
      photo.cleanup();
    }

  }

}


/* ==================================================
   29. 사진 스캔 버튼
================================================== */

shot.addEventListener('click', () => {

  if (starting || decodingPhoto) return;


  pickerOpen = true;

  stopCamera();

  fileEl.click();

});


fileEl.addEventListener('change', async () => {

  pickerOpen = false;

  const file =
    fileEl.files && fileEl.files[0];


  if (!file) {

    if (!running) {

      startCamera(
        selectedDeviceId || undefined
      );

    }

    return;

  }


  decodingPhoto = true;

  out.textContent =
    '사진에서 QR 코드를 분석하고 있습니다...';


  let text = null;


  try {

    text = await decodePhoto(file);

  } catch(e) {}


  fileEl.value = '';

  decodingPhoto = false;


  if (text) {

    await processDecodedText(text);

  } else {

    beep(300, 0.28);

    out.textContent =
      '사진에서 QR 코드를 찾지 못했습니다. ' +
      'QR 코드가 선명하고 크게 나오도록 다시 촬영해 주세요.';

  }


  if (!running) {

    await startCamera(
      selectedDeviceId || undefined
    );

  }

});


/* ==================================================
   30. 사진 선택 취소 및 브라우저 복귀
================================================== */

fileEl.addEventListener('cancel', () => {

  pickerOpen = false;

  if (!running && !decodingPhoto) {

    startCamera(
      selectedDeviceId || undefined
    );

  }

});


window.addEventListener('focus', () => {

  setTimeout(() => {

    if (
      pickerOpen &&
      !decodingPhoto &&
      !starting
    ) {

      pickerOpen = false;

      if (!running) {

        startCamera(
          selectedDeviceId || undefined
        );

      }

    }

  }, 1000);

});


document.addEventListener('visibilitychange', () => {

  if (document.visibilityState !== 'visible') {
    return;
  }


  setTimeout(() => {

    if (
      decodingPhoto ||
      pickerOpen ||
      starting
    ) {
      return;
    }


    if (
      !running ||
      !track ||
      track.readyState !== 'live'
    ) {

      startCamera(
        selectedDeviceId || undefined
      );

    }

  }, 600);

});


/* ==================================================
   31. 최초 실행
================================================== */

// QR 인식 엔진과 카메라를 함께 시작
startCamera();


// 인식 엔진 로딩 결과 확인
zxReady.then(() => {

  if (running) {
    updateInfo();
  }

});
