<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:10px;font-family:sans-serif}
#wrap{position:relative;width:100%;background:#000;min-height:160px;overflow:hidden}
#v{width:100%;display:block}
#aim{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:10px;pointer-events:none}
button{font-size:16px;padding:10px 6px}
</style></head><body>
<input id="name" placeholder="작업자 이름 입력" style="width:100%;font-size:20px;padding:8px;box-sizing:border-box;margin-bottom:8px">
<button id="snd" style="width:100%;margin-bottom:8px">🔊 소리 켜기 (한 번 누르세요)</button>
<div id="wrap"><video id="v" playsinline muted autoplay></video><div id="aim"></div></div>
<button id="startBtn" style="display:none;width:100%;margin:8px 0">📷 카메라 시작</button>
<div id="zoomBox" style="display:none;margin:8px 0;font-size:18px">
  🔍 확대 <input id="zoom" type="range" style="width:75%;vertical-align:middle">
</div>
<div style="display:flex;gap:6px;margin:8px 0">
  <button id="resBtn" style="flex:1">📐 해상도: 4K</button>
  <button id="shot" style="flex:1">📷 사진으로 스캔</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" style="display:none">
<p id="out" style="font-size:22px;word-break:break-all"></p>
<p id="info" style="font-size:12px;color:#666;word-break:break-all"></p>
<p style="font-size:11px;color:#888;text-align:right;margin-top:24px">ver0.9 / by KDH</p>
<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec';
const TOKEN = '1111';
const $ = id => document.getElementById(id);
const video = $('v'), out = $('out'), info = $('info'), nameEl = $('name'), snd = $('snd');
const startBtn = $('startBtn'), resBtn = $('resBtn'), shot = $('shot'), fileEl = $('file');
const zoomBox = $('zoomBox'), zoomEl = $('zoom');

window.addEventListener('error', e => { out.textContent = '오류: ' + (e.message || '알 수 없음'); });

/* ---------- 강력한 인식기(zxing-wasm) 불러오기 ---------- */
let zxStatus = '불러오는 중';
const ZX_URLS = [
  'https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.0/dist/iife/reader/index.js',
  'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.1/dist/iife/reader/index.js'
];
function loadZx(i) {
  if (typeof ZXingWASM !== 'undefined') { zxStatus = '준비됨'; return; }
  if (i >= ZX_URLS.length) { zxStatus = '불러오기 실패'; return; }
  const sc = document.createElement('script');
  sc.src = ZX_URLS[i];
  sc.onload = () => { zxStatus = (typeof ZXingWASM !== 'undefined') ? '준비됨' : '불러오기 실패'; };
  sc.onerror = () => loadZx(i + 1);
  document.head.appendChild(sc);
}
loadZx(0);

async function zxRead(imageData) {
  if (typeof ZXingWASM === 'undefined') return null;
  try {
    const r = await ZXingWASM.readBarcodes(imageData, {
      formats: ['QRCode'], tryHarder: true, tryRotate: true, tryInvert: true
    });
    zxStatus = '정상';
    const hit = r.find(x => x.text && x.isValid !== false);
    return hit ? hit.text : null;
  } catch(e) {
    zxStatus = '오류: ' + (e && e.message ? e.message : e);
    return null;
  }
}

/* 내장 인식기(안드로이드 크롬 등). 아이폰 사파리는 보통 없음 */
let bd = null;
try { if ('BarcodeDetector' in window) bd = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e) {}

/* 흑백 변환 + 대비 늘리기 (+ 색 반전). 반전 QR, 흐린 QR 대응 */
function enhance(imgData, invert) {
  const d = imgData.data, n = d.length / 4;
  const g = new Uint8ClampedArray(n);
  const hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const v = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    g[i] = v; hist[v]++;
  }
  const cut = n * 0.02;
  let lo = 0, hi = 255, acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= cut) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= cut) { hi = v; break; } }
  const range = Math.max(1, hi - lo);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    let v = (g[i] - lo) * 255 / range;
    v = v < 0 ? 0 : (v > 255 ? 255 : v);
    if (invert) v = 255 - v;
    d[j] = d[j + 1] = d[j + 2] = v;
    d[j + 3] = 255;
  }
  return imgData;
}

/* 한 장의 캔버스를 분석: 내장 인식기 먼저, 못 읽으면 강력 인식기.
   inv가 true이면 흑백·대비·반전 처리한 버전으로 분석 */
async function decodeCanvas(c, inv) {
  const ctx = c.getContext('2d', { willReadFrequently: true });
  let src = c, id = null;
  if (inv) {
    id = enhance(ctx.getImageData(0, 0, c.width, c.height), true);
    src = id;
  }
  if (bd) {
    try {
      const r = await bd.detect(src);
      if (r.length && r[0].rawValue) return r[0].rawValue;
    } catch(e) {}
  }
  if (typeof ZXingWASM !== 'undefined') {
    if (!id) id = ctx.getImageData(0, 0, c.width, c.height);
    return await zxRead(id);
  }
  return null;
}

/* ---------- 소리 ---------- */
let ac = null;
function unlockAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch(e) {}
}
['touchend', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { once: true }));
function beep(freq, dur) {
  try {
    unlockAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.value = 0.2;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch(e) {}
}
snd.addEventListener('click', () => {
  beep(1200, 0.12);
  snd.textContent = '🔊 소리 켜짐';
});

/* ---------- 작업자 이름 ---------- */
try { nameEl.value = localStorage.getItem('worker') || ''; } catch(e) {}
nameEl.addEventListener('input', () => {
  try { localStorage.setItem('worker', nameEl.value.trim()); } catch(e) {}
});

/* ---------- 시트로 전송 ---------- */
let busy = false;
async function handleScan(text) {
  if (busy) return false;
  busy = true;
  const name = nameEl.value.trim();
  if (!name) {
    beep(300, 0.3);
    out.textContent = '작업자 이름을 먼저 입력하세요';
    setTimeout(() => busy = false, 1500);
    return false;
  }
  beep(1200, 0.12);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch(e) {}
  const part = text.substring(50, 63);
  out.textContent = part;
  try { await navigator.clipboard.writeText(part); } catch(e) {}
  try {
    await fetch(URL_, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: TOKEN, text: text, name: name }) });
  } catch(e) { out.textContent = '전송 실패'; }
  setTimeout(() => busy = false, 1500);
  return true;
}

/* ---------- 카메라 ---------- */
const LEVELS = [
  { n: '4K',    w: 3840, h: 2160 },
  { n: '1080p', w: 1920, h: 1080 },
  { n: '720p',  w: 1280, h: 720 }
];
let lv = 0;
try {
  const q = parseInt(localStorage.getItem('lv2'));
  if (q >= 0 && q < LEVELS.length) lv = q;
} catch(e) {}
resBtn.textContent = '📐 해상도: ' + LEVELS[lv].n;

const inApp = /KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram|DaumApps/i.test(navigator.userAgent);
let stream = null, track = null, running = false, starting = false, decoding = false, pickerOpen = false;
let loopTimer = null;

function stopCamera() {
  running = false;
  clearTimeout(loopTimer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
  video.srcObject = null;
  zoomBox.style.display = 'none';
}

function showCamError(err) {
  const n = (err && err.name) || '';
  let m = '카메라를 열 수 없습니다 (' + n + ')';
  if (n === 'NotAllowedError' || n === 'SecurityError') m = '카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해 주세요 (아이폰: 설정 > Safari > 카메라)';
  else if (n === 'NotFoundError') m = '카메라를 찾을 수 없습니다';
  else if (n === 'NotReadableError') m = '다른 앱이 카메라를 사용 중입니다';
  if (inApp) m += ' / 카카오톡 등 앱 안의 브라우저일 수 있습니다. Safari나 Chrome에서 열어 주세요';
  out.textContent = m;
}

function setupTrack() {
  let caps = {}, st = {};
  try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e) {}
  try { st = track.getSettings ? track.getSettings() : {}; } catch(e) {}
  try {
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    }
  } catch(e) {}
  zoomBox.style.display = 'none';
  try {
    if (caps.zoom) {
      zoomEl.min = caps.zoom.min;
      zoomEl.max = caps.zoom.max;
      zoomEl.step = caps.zoom.step || 0.1;
      zoomEl.value = st.zoom || caps.zoom.min;
      zoomEl.oninput = () => {
        track.applyConstraints({ advanced: [{ zoom: parseFloat(zoomEl.value) }] }).catch(() => {});
      };
      zoomBox.style.display = 'block';
    }
  } catch(e) {}
}

async function startCamera() {
  if (starting) return false;
  starting = true;
  try {
    stopCamera();
    startBtn.style.display = 'none';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      out.textContent = '이 브라우저는 카메라를 지원하지 않습니다. 📷 사진으로 스캔을 사용하세요';
      return false;
    }
    const L = LEVELS[lv];
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: L.w }, height: { ideal: L.h } }
      });
    } catch(err) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } });
      } catch(err2) {
        showCamError(err2);
        startBtn.style.display = 'block';
        return false;
      }
    }
    track = stream.getVideoTracks()[0];
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.srcObject = stream;
    try { await video.play(); }
    catch(e) {
      startBtn.style.display = 'block';
      out.textContent = '아래 📷 카메라 시작 버튼을 눌러 주세요';
      return false;
    }
    setupTrack();
    running = true;
    loop();
    return true;
  } finally {
    starting = false;
  }
}

/* 선명도 측정(숫자가 클수록 선명): 화면 가운데 작은 영역 */
const shc = document.createElement('canvas');
shc.width = 256; shc.height = 256;
const shctx = shc.getContext('2d', { willReadFrequently: true });
let sharpVal = 0;
setInterval(() => {
  if (!running || !video.videoWidth || video.readyState < 2) return;
  try {
    const vw = video.videoWidth, vh = video.videoHeight;
    const m = Math.min(vw, vh) * 0.25;
    shctx.drawImage(video, (vw - m) / 2, (vh - m) / 2, m, m, 0, 0, 256, 256);
    const d = shctx.getImageData(0, 0, 256, 256).data;
    const g = new Float32Array(65536);
    for (let i = 0, j = 0; i < 65536; i++, j += 4) g[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;
    let s1 = 0, s2 = 0, n = 0;
    for (let y = 1; y < 255; y++) {
      for (let x = 1; x < 255; x++) {
        const i = y * 256 + x;
        const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - 256] - g[i + 256];
        s1 += l; s2 += l * l; n++;
      }
    }
    sharpVal = s2 / n - (s1 / n) * (s1 / n);
  } catch(e) {}
}, 400);

function updateInfo() {
  if (!running || !track) return;
  let st = {};
  try { st = track.getSettings ? track.getSettings() : {}; } catch(e) {}
  info.textContent = '요청 ' + LEVELS[lv].n + ' → 실제 ' + video.videoWidth + 'x' + video.videoHeight +
    (st.frameRate ? ' @' + Math.round(st.frameRate) + 'fps' : '') +
    ' / 선명도 ' + Math.round(sharpVal) +
    ' / 인식기: ' + (bd ? '내장+' : '') + '강력(' + zxStatus + ')';
}
setInterval(updateInfo, 700);
if (inApp) info.textContent = '앱 안의 브라우저로 보입니다. 카메라가 안 켜지면 Safari나 Chrome에서 열어 주세요';

/* ---------- 실시간 스캔: 반복 루프 하나 ---------- */
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });
const MAXPX = 3500000;
let lastText = '', lastSeen = 0, tickNo = 0;

async function loop() {
  if (!running) return;
  if (!busy && !decoding && video.readyState >= 2 && video.videoWidth) {
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      let f = 1;
      if (vw * vh > MAXPX) f = Math.sqrt(MAXPX / (vw * vh));
      const cw = Math.round(vw * f), ch = Math.round(vh * f);
      const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
      if (work.width !== cw) work.width = cw;
      if (work.height !== ch) work.height = ch;
      wctx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);
      const text = await decodeCanvas(work, (tickNo++ % 2) === 1);
      if (text) {
        const now = Date.now();
        if (text === lastText && now - lastSeen < 2500) {
          lastSeen = now;
        } else if (await handleScan(text)) {
          lastText = text;
          lastSeen = now;
        }
      }
    } catch(e) {}
  }
  if (running) loopTimer = setTimeout(loop, 100);
}

/* ---------- 버튼 ---------- */
startBtn.addEventListener('click', () => { startCamera(); });

resBtn.addEventListener('click', async () => {
  lv = (lv + 1) % LEVELS.length;
  try { localStorage.setItem('lv2', String(lv)); } catch(e) {}
  resBtn.textContent = '📐 해상도: ' + LEVELS[lv].n;
  info.textContent = '';
  await startCamera();
});

/* ---------- 사진으로 스캔 ---------- */
let lastDims = '';
async function loadPhoto(f) {
  if (window.createImageBitmap) {
    try {
      const b = await createImageBitmap(f);
      return { src: b, w: b.width, h: b.height };
    } catch(e) {}
  }
  const url = URL.createObjectURL(f);
  const im = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = url;
  });
  return { src: im, w: im.naturalWidth, h: im.naturalHeight };
}

async function decodePhoto(f) {
  let p;
  try { p = await loadPhoto(f); } catch(e) { return null; }
  lastDims = p.w + 'x' + p.h;
  const tries = [{ crop: 1, max: 3000 }, { crop: 0.6, max: 4096 }, { crop: 0.35, max: 4096 }];
  for (const t of tries) {
    const sw = p.w * t.crop, sh = p.h * t.crop;
    const sx = (p.w - sw) / 2, sy = (p.h - sh) / 2;
    const k = Math.min(1, t.max / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sw * k));
    c.height = Math.max(1, Math.round(sh * k));
    c.getContext('2d', { willReadFrequently: true }).drawImage(p.src, sx, sy, sw, sh, 0, 0, c.width, c.height);
    let text = await decodeCanvas(c, false);
    if (!text) text = await decodeCanvas(c, true);
    c.width = 1; c.height = 1;
    if (text) return text;
  }
  return null;
}

shot.addEventListener('click', () => {
  pickerOpen = true;
  stopCamera();
  fileEl.click();
});
fileEl.addEventListener('change', async () => {
  pickerOpen = false;
  const f = fileEl.files[0];
  if (!f) { if (!running) startCamera(); return; }
  decoding = true;
  out.textContent = '사진 분석 중...';
  let text = null;
  try { text = await decodePhoto(f); } catch(e) {}
  fileEl.value = '';
  decoding = false;
  if (text) {
    await handleScan(text);
  } else {
    beep(300, 0.3);
    out.textContent = '사진에서 QR을 찾지 못했습니다 (사진 ' + lastDims +
      ' / 강력인식기: ' + zxStatus + ' / 내장인식기: ' + (bd ? '있음' : '없음') + ')';
  }
  if (!running) startCamera();
});
fileEl.addEventListener('cancel', () => {
  pickerOpen = false;
  if (!running && !decoding) startCamera();
});
window.addEventListener('focus', () => {
  setTimeout(() => {
    if (pickerOpen && !decoding) {
      pickerOpen = false;
      if (!running) startCamera();
    }
  }, 1200);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  setTimeout(() => {
    if (decoding || pickerOpen) return;
    if (!running || !track || track.readyState !== 'live') startCamera();
  }, 600);
});

startCamera();
</script>
</body></html>
