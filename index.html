<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head><body>
<input id="name" placeholder="작업자 이름 입력" style="width:100%;font-size:20px;padding:8px;box-sizing:border-box;margin-bottom:8px">
<button id="snd" style="width:100%;font-size:20px;padding:10px;margin-bottom:8px">🔊 소리 켜기 (먼저 한 번 누르세요)</button>
<div id="r" style="width:100%"></div>
<div id="zoomBox" style="display:none;margin:8px 0;font-size:18px">
  🔍 확대 <input id="zoom" type="range" style="width:75%;vertical-align:middle">
</div>
<div style="display:flex;gap:8px;margin:8px 0">
  <button id="camBtn" style="flex:1;font-size:18px;padding:10px">🔄 카메라 전환</button>
  <button id="shot" style="flex:1;font-size:18px;padding:10px">📷 사진으로 스캔</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" style="display:none">
<div id="tmp" style="display:none"></div>
<p id="out" style="font-size:22px;word-break:break-all"></p>
<p style="font-size:11px;color:#888;text-align:right;margin-top:24px">ver0.5 / by KDH</p>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec';
const TOKEN = '1111';
const $ = id => document.getElementById(id);
const nameEl = $('name'), out = $('out'), snd = $('snd');
const camBtn = $('camBtn'), shot = $('shot'), fileEl = $('file');

let ac = null;
function beep(freq, dur) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.value = 0.2;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch(e) {}
}
snd.addEventListener('click', () => {
  beep(1200, 0.12);
  snd.textContent = '🔊 소리 켜짐';
});

try { nameEl.value = localStorage.getItem('worker') || ''; } catch(e) {}
nameEl.addEventListener('input', () => {
  try { localStorage.setItem('worker', nameEl.value.trim()); } catch(e) {}
});

const s = new Html5Qrcode("r", {
  formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
  experimentalFeatures: { useBarCodeDetectorIfSupported: true }
});
let busy = false, scannerOn = false, decoding = false, camId = null, cams = [];
try { camId = localStorage.getItem('cam') || null; } catch(e) {}

async function handleScan(text) {
  if (busy) return; busy = true;
  const name = nameEl.value.trim();
  if (!name) {
    beep(300, 0.3);
    out.textContent = '작업자 이름을 먼저 입력하세요';
    setTimeout(() => busy = false, 1500);
    return;
  }
  beep(1200, 0.12);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch(e) {}
  const part = text.substring(50, 63);
  out.textContent = part;
  try { await navigator.clipboard.writeText(part); } catch(e) {}
  try {
    await fetch(URL_, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({token:TOKEN, text:text, name:name})});
  } catch(e) { out.textContent = '전송 실패'; }
  setTimeout(() => busy = false, 1500);
}

function makeCfg(id) {
  const v = { width: {ideal:3840}, height: {ideal:2160}, advanced: [{focusMode:"continuous"}] };
  if (id) v.deviceId = { exact: id }; else v.facingMode = "environment";
  return {
    fps: 10,
    qrbox: (w, h) => {
      const sz = Math.floor(Math.min(w, h) * 0.7);
      return { width: sz, height: sz };
    },
    videoConstraints: v
  };
}

function setupZoom() {
  const box = $('zoomBox');
  box.style.display = 'none';
  try {
    const z = s.getRunningTrackCameraCapabilities().zoomFeature();
    if (z.isSupported()) {
      const el = $('zoom');
      el.min = z.min(); el.max = z.max(); el.step = z.step();
      const start = Math.min(Math.max(2, z.min()), z.max());
      el.value = start;
      z.apply(start);
      el.oninput = () => z.apply(parseFloat(el.value));
      box.style.display = 'block';
    }
  } catch(e) {}
}

async function startScanner(id) {
  try {
    await s.start(id ? id : { facingMode: "environment" }, makeCfg(id), handleScan);
  } catch(err) {
    if (id) {
      camId = null;
      try { localStorage.removeItem('cam'); } catch(e) {}
      return startScanner(null);
    }
    out.textContent = '카메라 실행 실패: ' + err;
    return;
  }
  scannerOn = true;
  setupZoom();
  try { cams = await Html5Qrcode.getCameras(); } catch(e) {}
}
async function stopScanner() {
  if (!scannerOn) return;
  scannerOn = false;
  try { await s.stop(); } catch(e) {}
}
async function resumeScanner() {
  if (scannerOn) return;
  await startScanner(camId);
}

camBtn.addEventListener('click', async () => {
  if (cams.length < 2) { out.textContent = '전환할 카메라가 없습니다'; return; }
  let i = cams.findIndex(c => c.id === camId);
  i = (i + 1) % cams.length;
  camId = cams[i].id;
  try { localStorage.setItem('cam', camId); } catch(e) {}
  await stopScanner();
  await startScanner(camId);
  out.textContent = '카메라 ' + (i + 1) + '/' + cams.length + ': ' + (cams[i].label || '');
});

  const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const tmp = new Html5Qrcode("tmp");
  for (const crop of [1, 0.6]) {

      const
