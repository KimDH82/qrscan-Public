<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QR 코드 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
    }

    #name {
      width: 100%;
      box-sizing: border-box;
      font-size: 20px;
      padding: 10px;
      margin-bottom: 8px;
    }

    button {
      font-size: 16px;
      padding: 12px 5px;
      cursor: pointer;
    }

    #snd {
      width: 100%;
      margin-bottom: 8px;
    }

    #r {
      width: 100%;
      margin: auto;
    }

    #r video {
      width: 100%;
      height: auto;
    }

    #zoomBox {
      display: none;
      margin: 10px 0;
      font-size: 16px;
    }

    #zoom {
      width: 70%;
      vertical-align: middle;
    }

    .buttons {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }

    .buttons button {
      flex: 1;
    }

    #out {
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
      margin-top: 18px;
    }

    #info {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }

    #tmp {
      display: none;
    }
  </style>
</head>

<body>

  <h2>QR 코드 스캔</h2>

  <input
    id="name"
    placeholder="작업자 이름 입력"
    autocomplete="name"
  >

  <button id="snd">
    🔊 소리 켜기 (먼저 한 번 누르세요)
  </button>

  <div id="r"></div>

  <div id="zoomBox">
    🔍 확대
    <input id="zoom" type="range">
  </div>

  <div class="buttons">
    <button id="camBtn">🔄 카메라 전환</button>
    <button id="resBtn">📐 해상도 변경</button>
    <button id="shot">📷 사진으로 스캔</button>
  </div>

  <input
    id="file"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none"
  >

  <div id="tmp"></div>

  <p id="out">QR코드를 카메라에 비춰주세요.</p>
  <p id="info"></p>

  <p style="font-size:11px;color:#888;text-align:right">
    ver0.7 / by KDH
  </p>

<script>

// =====================================
// 1. Google Apps Script 연결 정보
// =====================================

const URL_ =
  'https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec';

// Apps Script의 TOKEN과 동일하게 입력
const TOKEN = '여기에_TOKEN_입력';


// =====================================
// 2. 화면 요소
// =====================================

const $ = id => document.getElementById(id);

const nameEl = $('name');
const out = $('out');
const info = $('info');

const snd = $('snd');
const camBtn = $('camBtn');
const resBtn = $('resBtn');
const shot = $('shot');
const fileEl = $('file');


// =====================================
// 3. 오류 표시
// =====================================

window.addEventListener('error', e => {
  out.textContent = '오류: ' + (e.message || '알 수 없음');
});

if (typeof Html5Qrcode === 'undefined') {
  out.textContent = '스캐너를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
  throw new Error('html5-qrcode 라이브러리 로딩 실패');
}


// =====================================
// 4. 스캔음 및 진동
// =====================================

let ac = null;

function beep(freq, dur) {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (ac.state === 'suspended') {
      ac.resume();
    }

    const o = ac.createOscillator();
    const g = ac.createGain();

    o.type = 'square';
    o.frequency.value = freq;
    g.gain.value = 0.2;

    o.connect(g);
    g.connect(ac.destination);

    o.start();
    o.stop(ac.currentTime + dur);

  } catch(e) {}
}

snd.addEventListener('click', () => {
  beep(1200, 0.12);
  snd.textContent = '🔊 소리 켜짐';
});


// =====================================
// 5. 작업자 이름 저장
// =====================================

try {
  nameEl.value = localStorage.getItem('worker') || '';
} catch(e) {}

nameEl.addEventListener('input', () => {
  try {
    localStorage.setItem('worker', nameEl.value.trim());
  } catch(e) {}
});


// =====================================
// 6. QR 스캐너 생성
// =====================================

// QR 코드만 인식하도록 설정
// BarcodeDetector 별도 실행은 사용하지 않음

const scanner = new Html5Qrcode('r', {
  formatsToSupport: [
    Html5QrcodeSupportedFormats.QR_CODE
  ]
});


// =====================================
// 7. 카메라 및 해상도 설정
// =====================================

const LEVELS = [
  {
    name: '4K',
    width: 3840,
    height: 2160
  },
  {
    name: '1080p',
    width: 1920,
    height: 1080
  },
  {
    name: '720p',
    width: 1280,
    height: 720
  },
  {
    name: '기본',
    width: null,
    height: null
  }
];

let lvPref = 1;
let curLv = 1;

let camId = null;
let cams = [];

let scannerOn = false;
let busy = false;
let decoding = false;
let session = 0;

try {
  const savedLv = parseInt(localStorage.getItem('lv'));

  if (savedLv >= 0 && savedLv < LEVELS.length) {
    lvPref = savedLv;
  }

  camId = localStorage.getItem('cam') || null;

} catch(e) {}


// =====================================
// 8. 카메라 설정 구성
// =====================================

function makeCfg(id, lv) {

  const level = LEVELS[lv];

  const constraints = {
    facingMode: 'environment',
    advanced: [
      { focusMode: 'continuous' }
    ]
  };

  if (id) {
    constraints.deviceId = { exact: id };
    delete constraints.facingMode;
  }

  if (level.width) {
    constraints.width = {
      ideal: level.width
    };

    constraints.height = {
      ideal: level.height
    };
  }

  return {
    fps: 10,

    // qrbox를 지정하지 않음
    // 카메라 영상 전체를 QR 인식 영역으로 사용

    videoConstraints: constraints
  };
}


// =====================================
// 9. 실제 카메라 정보 표시
// =====================================

function showInfo() {

  setTimeout(() => {

    const v = document.querySelector('#r video');

    if (!v || !v.videoWidth) return;

    let label = '';

    try {
      label = v.srcObject.getVideoTracks()[0].label;
    } catch(e) {}

    info.textContent =
      (label || '카메라') +
      ' / 실제 해상도: ' +
      v.videoWidth + 'x' + v.videoHeight +
      ' / 설정: ' + LEVELS[curLv].name;

  }, 1000);
}


// =====================================
// 10. 카메라 확대 기능
// =====================================

function setupZoom() {

  const box = $('zoomBox');

  box.style.display = 'none';

  try {

    const z = scanner
      .getRunningTrackCameraCapabilities()
      .zoomFeature();

    if (z.isSupported()) {

      const el = $('zoom');

      el.min = z.min();
      el.max = z.max();
      el.step = z.step();
      el.value = z.value() || z.min();

      el.oninput = () => {
        Promise.resolve(
          z.apply(parseFloat(el.value))
        ).catch(() => {});
      };

      box.style.display = 'block';
    }

  } catch(e) {}
}


// =====================================
// 11. QR 데이터 Google Sheets 전송
// =====================================

async function handleScan(text) {

  if (busy || decoding) return;

  busy = true;

  const name = nameEl.value.trim();

  if (!name) {

    beep(300, 0.3);

    out.textContent = '작업자 이름을 먼저 입력하세요.';

    setTimeout(() => {
      busy = false;
    }, 1500);

    return;
  }

  beep(1200, 0.12);

  try {
    if (navigator.vibrate) {
      navigator.vibrate(80);
    }
  } catch(e) {}

  const part = text.substring(50, 63);

  out.textContent = part;

  try {
    await navigator.clipboard.writeText(part);
  } catch(e) {}

  try {

    await fetch(URL_, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain'
      },
      body: JSON.stringify({
        token: TOKEN,
        text: text,
        name: name
      })
    });

    out.textContent =
      part + '\n\n전송 요청 완료 (스프레드시트 등록 확인 필요)';

  } catch(e) {

    out.textContent = '전송 요청 실패: ' + e.message;
  }

  setTimeout(() => {
    busy = false;
  }, 1500);
}


// =====================================
// 12. 카메라 시작
// =====================================

async function startScanner(id, lv) {

  if (lv === undefined) {
    lv = lvPref;
  }

  const mySession = ++session;

  try {

    await scanner.start(
      id
        ? { deviceId: { exact: id } }
        : { facingMode: 'environment' },

      makeCfg(id, lv),

      handleScan
    );

  } catch(err) {

    try {
      await scanner.stop();
    } catch(e) {}

    // 해상도 설정 실패 시 다음 단계로 낮춤
    if (lv < LEVELS.length - 1) {
      return startScanner(id, lv + 1);
    }

    // 선택한 카메라 실패 시 후면 카메라로 재시도
    if (id) {

      camId = null;

      try {
        localStorage.removeItem('cam');
      } catch(e) {}

      return startScanner(null, lvPref);
    }

    out.textContent = '카메라 실행 실패: ' + err;

    return;
  }

  scannerOn = true;
  curLv = lv;

  setupZoom();
  showInfo();

  try {
    cams = await Html5Qrcode.getCameras();
  } catch(e) {}

  setTimeout(async () => {

    if (mySession !== session || !scannerOn) return;

    const v = document.querySelector('#r video');

    if ((!v || !v.videoWidth) && lv < LEVELS.length - 1) {

      await stopScanner();

      startScanner(id, lv + 1);
    }

  }, 3000);
}


// =====================================
// 13. 카메라 정지 및 재시작
// =====================================

async function stopScanner() {

  if (!scannerOn) return;

  scannerOn = false;
  session++;

  try {
    await scanner.stop();
  } catch(e) {}
}

async function resumeScanner() {

  if (scannerOn || decoding) return;

  await startScanner(camId, lvPref);
}


// =====================================
// 14. 카메라 전환
// =====================================

camBtn.addEventListener('click', async () => {

  if (cams.length < 2) {

    out.textContent = '전환할 카메라가 없습니다.';

    return;
  }

  let i = cams.findIndex(c => c.id === camId);

  i = (i + 1) % cams.length;

  camId = cams[i].id;

  try {
    localStorage.setItem('cam', camId);
  } catch(e) {}

  await stopScanner();

  await startScanner(camId, lvPref);

  out.textContent =
    '카메라 전환: ' +
    (cams[i].label || '카메라 ' + (i + 1));
});


// =====================================
// 15. 해상도 변경
// =====================================

resBtn.addEventListener('click', async () => {

  lvPref = (lvPref + 1) % LEVELS.length;

  try {
    localStorage.setItem('lv', String(lvPref));
  } catch(e) {}

  info.textContent = '';

  await stopScanner();

  await startScanner(camId, lvPref);

  out.textContent =
    '해상도 설정: ' + LEVELS[lvPref].name;
});


// =====================================
// 16. 사진에서 QR 코드 읽기
// =====================================

async function decodeFile(file) {

  let bitmap;

  try {
    bitmap = await createImageBitmap(file);
  } catch(e) {
    return null;
  }

  const tmp = new Html5Qrcode('tmp', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  });

  // 원본 사진부터 인식 시도
  try {
    return await tmp.scanFile(file, false);
  } catch(e) {}

  // 중앙 부분 확대 및 축소하여 재시도
  for (const crop of [0.7, 0.5]) {

    for (const scale of [1, 1.5, 2]) {

      const sw = bitmap.width * crop;
      const sh = bitmap.height * crop;

      const sx = (bitmap.width - sw) / 2;
      const sy = (bitmap.height - sh) / 2;

      const canvas = document.createElement('canvas');

      canvas.width = Math.round(sw * scale);
      canvas.height = Math.round(sh * scale);

      const ctx = canvas.getContext('2d');

      ctx.drawImage(
        bitmap,
        sx, sy, sw, sh,
        0, 0, canvas.width, canvas.height
      );

      try {

        const blob = await new Promise(resolve => {
          canvas.toBlob(resolve, 'image/png');
        });

        if (!blob) continue;

        const imageFile = new File(
          [blob],
          'qr.png',
          { type: 'image/png' }
        );

        return await tmp.scanFile(imageFile, false);

      } catch(e) {}
    }
  }

  return null;
}


// =====================================
// 17. 사진 스캔 버튼
// =====================================

shot.addEventListener('click', async () => {

  await stopScanner();

  fileEl.click();
});

fileEl.addEventListener('change', async () => {

  const file = fileEl.files[0];

  if (!file) {
    resumeScanner();
    return;
  }

  decoding = true;

  out.textContent = '사진 분석 중입니다...';

  try {

    const text = await decodeFile(file);

    fileEl.value = '';

    if (text) {

      decoding = false;

      await handleScan(text);

    } else {

      beep(300, 0.3);

      out.textContent =
        '사진에서 QR 코드를 찾지 못했습니다. 다시 촬영해 주세요.';

    }

  } catch(e) {

    out.textContent = '사진 분석 오류: ' + e.message;

  } finally {

    decoding = false;

    setTimeout(() => {
      resumeScanner();
    }, 1000);
  }
});


// =====================================
// 18. 앱 화면 복귀 시 카메라 재시작
// =====================================

document.addEventListener('visibilitychange', () => {

  if (document.visibilityState === 'visible') {

    setTimeout(() => {

      if (!decoding) {
        resumeScanner();
      }

    }, 800);
  }
});


// =====================================
// 19. 최초 카메라 실행
// =====================================

startScanner(camId, lvPref);

</script>

</body>
</html>
