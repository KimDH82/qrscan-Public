<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head><body>
<input id="name" placeholder="작업자 이름 입력" style="width:100%;font-size:20px;padding:8px;box-sizing:border-box;margin-bottom:8px">
<button id="snd" style="width:100%;font-size:20px;padding:10px;margin-bottom:8px">🔊 소리 켜기 (먼저 한 번 누르세요)</button>
<div id="r" style="width:100%"></div>
<div id="zoomBox" style="display:none;margin:8px 0;font-size:18px">
  🔍 확대 <input id="zoom" type="range" style="width:75%;vertical-align:middle">
</div>
<div style="display:flex;gap:6px;margin:8px 0">
  <button id="camBtn" style="flex:1;font-size:15px;padding:10px 4px">🔄 카메라 전환</button>
  <button id="resBtn" style="flex:1;font-size:15px;padding:10px 4px">📐 해상도 변경</button>
  <button id="shot" style="flex:1;font-size:15px;padding:10px 4px">📷 사진으로 스캔</button>
</div>
<button id="pasteBtn" style="width:100%;font-size:16px;padding:10px;margin-bottom:8px">📋 복사한 링크 붙여넣어 등록</button>
<input id="file" type="file" accept="image/*" capture="environment" style="display:none">
<div id="tmp" style="display:none"></div>
<p id="out" style="font-size:22px;word-break:break-all"></p>
<p id="info" style="font-size:12px;color:#666;word-break:break-all"></p>
<p style="font-size:11px;color:#888;text-align:right;margin-top:24px">ver0.7 / by KDH</p>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec';
const TOKEN = '1111';
const $ = id => document.getElementById(id);
const nameEl = $('name'), out = $('out'), snd = $('snd'), info = $('info');
const camBtn = $('camBtn'), resBtn = $('resBtn'), shot = $('shot'), fileEl = $('file'), pasteBtn = $('pasteBtn');

window.addEventListener('error', e => {
  if (/lib-missing/.test(e.message || '')) return;
  out.textContent = '오류: ' + (e.message || '알 수 없음');
});
if (typeof Html5Qrcode === 'undefined') {
  out.textContent = '스캐너를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요';
  throw new Error('lib-missing');
}

/* ---------- 강력한 인식기(zxing-wasm) 불러오기 ---------- */
let zxStatus = '불러오는 중';
const ZX_URLS = [
  'https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.0/dist/iife/reader/index.js',
  'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.1/dist/iife/reader/index.js'
];
function loadZx(i) {
  if (typeof ZXingWASM !== 'undefined') { zxStatus = '준비됨'; return; }
  if (i >= ZX_URLS.length) { zxStatus = '불러오기 실패'; return; }
  const sc = document.createElement('script');
  sc.src = ZX_URLS[i];
  sc.onload = () => { zxStatus = (typeof ZXingWASM !== 'undefined') ? '준비됨' : '불러오기 실패'; };
  sc.onerror = () => loadZx(i + 1);
  document.head.appendChild(sc);
}
loadZx(0);

async function zxRead(src) {
  if (typeof ZXingWASM === 'undefined') return null;
  try {
    const r = await ZXingWASM.readBarcodes(src, {
      formats: ['QRCode'], tryHarder: true, tryRotate: true, tryInvert: true
    });
    zxStatus = '정상';
    const hit = r.find(x => x.text && x.isValid !== false);
    return hit ? hit.text : null;
  } catch(e) {
    zxStatus = '오류: ' + (e && e.message ? e.message : e);
    return null;
  }
}

/* ---------- 소리 ---------- */
let ac = null;
function beep(freq, dur) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.value = 0.2;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch(e) {}
}
snd.addEventListener('click', () => {
  beep(1200, 0.12);
  snd.textContent = '🔊 소리 켜짐';
});

/* ---------- 작업자 이름 ---------- */
try { nameEl.value = localStorage.getItem('worker') || ''; } catch(e) {}
nameEl.addEventListener('input', () => {
  try { localStorage.setItem('worker', nameEl.value.trim()); } catch(e) {}
});

/* ---------- 스캐너 ---------- */
const s = new Html5Qrcode("r", {
  formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
  experimentalFeatures: { useBarCodeDetectorIfSupported: true }
});
let bd = null;
try { if ('BarcodeDetector' in window) bd = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e) {}

let busy = false, scannerOn = false, decoding = false, detecting = false, zxBusy = false;
let camId = null, cams = [], session = 0, curLv = 1, lastDims = '';
try { camId = localStorage.getItem('cam') || null; } catch(e) {}

const LEVELS = [
  { n: '4K',    c: { width: {ideal:3840}, height: {ideal:2160}, advanced: [{focusMode:"continuous"}] } },
  { n: '1080p', c: { width: {ideal:1920}, height: {ideal:1080}, advanced: [{focusMode:"continuous"}] } },
  { n: '720p',  c: { width: {ideal:1280}, height: {ideal:720} } },
  { n: '기본',  c: {} }
];
let lvPref = 1;
try {
  const q = parseInt(localStorage.getItem('lv'));
  if (q >= 0 && q < LEVELS.length) lvPref = q;
} catch(e) {}

async function handleScan(text) {
  if (busy) return; busy = true;
  const name = nameEl.value.trim();
  if (!name) {
    beep(300, 0.3);
    out.textContent = '작업자 이름을 먼저 입력하세요';
    setTimeout(() => busy = false, 1500);
    return;
  }
  beep(1200, 0.12);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch(e) {}
  const part = text.substring(50, 63);
  out.textContent = part;
  try { await navigator.clipboard.writeText(part); } catch(e) {}
  try {
    await fetch(URL_, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({token:TOKEN, text:text, name:name})});
  } catch(e) { out.textContent = '전송 실패'; }
  setTimeout(() => busy = false, 1500);
}

function makeCfg(id, lv) {
  const v = Object.assign({}, LEVELS[lv].c);
  if (id) v.deviceId = { exact: id }; else v.facingMode = "environment";
  return {
    fps: 15,
    qrbox: (w, h) => {
      const sz = Math.floor(Math.min(w, h) * 0.8);
      return { width: sz, height: sz };
    },
    videoConstraints: v
  };
}

function setupZoom() {
  const box = $('zoomBox');
  box.style.display = 'none';
  try {
    const z = s.getRunningTrackCameraCapabilities().zoomFeature();
    if (z.isSupported()) {
      const el = $('zoom');
      el.min = z.min(); el.max = z.max(); el.step = z.step();
      el.value = z.value() || z.min();
      el.oninput = () => { Promise.resolve(z.apply(parseFloat(el.value))).catch(() => {}); };
      box.style.display = 'block';
    }
  } catch(e) {}
}

function updateInfo() {
  if (!scannerOn) return;
  const v = document.querySelector('#r video');
  if (!v || !v.videoWidth) return;
  let label = '';
  try { label = v.srcObject.getVideoTracks()[0].label; } catch(e) {}
  info.textContent = (label || '카메라') + ' / ' + v.videoWidth + 'x' + v.videoHeight +
    ' / 설정 ' + LEVELS[curLv].n + ' / 내장인식기: ' + (bd ? '있음' : '없음') +
    ' / 강력인식기: ' + zxStatus;
}
setInterval(updateInfo, 1500);

async function startScanner(id, lv) {
  if (lv === undefined) lv = lvPref;
  const my = ++session;
  try {
    await s.start(id ? id : { facingMode: "environment" }, makeCfg(id, lv), handleScan);
  } catch(err) {
    try { await s.stop(); } catch(e) {}
    if (lv < LEVELS.length - 1) return startScanner(id, lv + 1);
    if (id) {
      camId = null;
      try { localStorage.removeItem('cam'); } catch(e) {}
      return startScanner(null, lvPref);
    }
    out.textContent = '카메라 실행 실패: ' + err;
    return;
  }
  scannerOn = true;
  curLv = lv;
  setupZoom();
  try { cams = await Html5Qrcode.getCameras(); } catch(e) {}
  setTimeout(async () => {
    if (my !== session || !scannerOn) return;
    const v = document.querySelector('#r video');
    if ((!v || !v.videoWidth) && lv < LEVELS.length - 1) {
      await stopScanner();
      startScanner(id, lv + 1);
    }
  }, 3000);
}
async function stopScanner() {
  if (!scannerOn) return;
  scannerOn = false;
  try { await s.stop(); } catch(e) {}
}
async function resumeScanner() {
  if (scannerOn) return;
  await startScanner(camId, lvPref);
}

/* 내장 인식기: 화면 전체를 직접 분석 */
setInterval(async () => {
  if (!bd || !scannerOn || busy || detecting || decoding) return;
  const v = document.querySelector('#r video');
  if (!v || !v.videoWidth) return;
  detecting = true;
  try {
    const r = await bd.detect(v);
    if (r.length) handleScan(r[0].rawValue);
  } catch(e) {}
  detecting = false;
}, 250);

/* 강력한 인식기: 화면 가운데 70%를 원본 해상도로 분석 */
setInterval(async () => {
  if (!scannerOn || busy || zxBusy || decoding) return;
  if (typeof ZXingWASM === 'undefined') return;
  const v = document.querySelector('#r video');
  if (!v || !v.videoWidth) return;
  zxBusy = true;
  try {
    const vw = v.videoWidth, vh = v.videoHeight;
    const cw = Math.round(vw * 0.7), ch = Math.round(vh * 0.7);
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, cw, ch);
    const t = await zxRead(ctx.getImageData(0, 0, cw, ch));
    if (t) handleScan(t);
  } catch(e) {}
  zxBusy = false;
}, 450);

camBtn.addEventListener('click', async () => {
  if (cams.length < 2) { out.textContent = '전환할 카메라가 없습니다'; return; }
  let i = cams.findIndex(c => c.id === camId);
  i = (i + 1) % cams.length;
  camId = cams[i].id;
  try { localStorage.setItem('cam', camId); } catch(e) {}
  await stopScanner();
  await startScanner(camId, lvPref);
  out.textContent = '카메라 ' + (i + 1) + '/' + cams.length + ': ' + (cams[i].label || '');
});

resBtn.addEventListener('click', async () => {
  lvPref = (lvPref + 1) % LEVELS.length;
  try { localStorage.setItem('lv', String(lvPref)); } catch(e) {}
  info.textContent = '';
  await stopScanner();
  await startScanner(camId, lvPref);
  out.textContent = '해상도 설정: ' + LEVELS[lvPref].n;
});

/* ---------- 사진 스캔 ---------- */
async function decodeFile(f) {
  let bmp;
  try { bmp = await createImageBitmap(f); } catch(e) { return null; }
  lastDims = bmp.width + 'x' + bmp.height;

  let t = await zxRead(f);
  if (t) return t;

  const tmp = new Html5Qrcode("tmp");
  for (const crop of [1, 0.6, 0.35]) {
    const sw = bmp.width * crop, sh = bmp.height * crop;
    const sx = (bmp.width - sw) / 2, sy = (bmp.height - sh) / 2;
    const c = document.createElement('canvas');
    c.width = Math.round(sw);
    c.height = Math.round(sh);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
    if (crop < 1) {
      t = await zxRead(ctx.getImageData(0, 0, c.width, c.height));
      if (t) return t;
    }
    if (bd) {
      try {
        const r = await bd.detect(c);
        if (r.length) return r[0].rawValue;
      } catch(e) {}
    }
    if (crop < 1) {
      try {
        const blob = await new Promise(res => c.toBlob(res, 'image/png'));
        const file = new File([blob], 'x.png', { type: 'image/png' });
        return await tmp.scanFile(file, false);
      } catch(e) {}
    }
  }
  return null;
}

shot.addEventListener('click', () => {
  fileEl.click();
  stopScanner();
});
fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0];
  if (!f) { resumeScanner(); return; }
  decoding = true;
  out.textContent = '사진 분석 중...';
  const text = await decodeFile(f);
  fileEl.value = '';
  decoding = false;
  if (text) {
    await handleScan(text);
  } else {
    beep(300, 0.3);
    out.textContent = '사진에서 QR을 찾지 못했습니다 (사진 ' + lastDims +
      ' / 강력인식기: ' + zxStatus + ' / 내장인식기: ' + (bd ? '있음' : '없음') + ')';
  }
  resumeScanner();
});
fileEl.addEventListener('cancel', () => { resumeScanner(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    setTimeout(() => { if (!decoding) resumeScanner(); }, 800);
  }
});

/* ---------- 복사한 링크 붙여넣기 ---------- */
pasteBtn.addEventListener('click', async () => {
  let t = '';
  try { t = await navigator.clipboard.readText(); } catch(e) {}
  if (!t || t.trim().length < 51) t = prompt('복사한 QR 링크를 붙여넣으세요', '') || '';
  t = t.trim();
  if (t.length < 51) {
    beep(300, 0.3);
    out.textContent = '링크가 비어 있거나 너무 짧습니다';
    return;
  }
  handleScan(t);
});

startScanner(camId, lvPref);
</script>
</body></html>
