
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battery QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.7/dist/iife/reader/index.js"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:8px;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
  font-size:14px;
}

.container {
  width:100%;
  max-width:650px;
  margin:auto;
}

h3 {
  margin:2px 0 8px;
  font-size:18px;
}

.top-row {
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:7px;
}

.name-input {
  flex:1;
  min-width:0;
  height:36px;
  padding:5px 8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

button,select {
  height:36px;
  border:1px solid #bbb;
  border-radius:6px;
  background:white;
  padding:0 9px;
  font-size:13px;
}

button:active {
  background:#e2e8f0;
}

#soundBtn {
  white-space:nowrap;
  min-width:90px;
}

.control-row {
  display:flex;
  gap:5px;
  margin-bottom:7px;
}

.control-row select {
  flex:1;
  min-width:0;
}

.control-row button {
  white-space:nowrap;
}

.camera-box {
  width:100%;
  height:clamp(300px,55vh,520px);
  background:#111;
  border-radius:8px;
  overflow:hidden;
  position:relative;
}

#video {
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#111;
}

.camera-guide {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:68%;
  height:75%;
  border:2px solid rgba(0,255,100,.75);
  border-radius:10px;
  pointer-events:none;
}

.status-box {
  margin-top:7px;
  padding:9px 10px;
  border-radius:7px;
  background:white;
  border:1px solid #ddd;
}

#mainStatus {
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

#mainStatus.status-error {
  color:#d93025;
}

#resultStatus {
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
  color:#1677d2;
  font-weight:700;
  animation:resultPulse 1.25s ease-in-out infinite;
}

@keyframes resultPulse {
  0%,100% {
    opacity:1;
    transform:scale(1);
  }
  50% {
    opacity:.55;
    transform:scale(1.015);
  }
}

#detailStatus {
  font-size:11px;
  color:#666;
  margin-top:5px;
  line-height:1.4;
}

.photo-input {
  display:none;
}

@media(max-width:380px) {
  body { padding:5px; }

  .top-row,.control-row {
    gap:4px;
  }

  button,select {
    padding:0 6px;
    font-size:12px;
  }

  #soundBtn {
    min-width:82px;
  }

  .camera-box {
    height:55vh;
    min-height:300px;
  }
}
</style>
</head>

<body>
<div class="container">

<h3>배터리 QR Scanner <small style="font-size:11px;color:#777;">v0.14</small></h3>

<div class="top-row">
  <input id="workerName" class="name-input"
         type="text" placeholder="작업자 이름 입력">
  <button id="soundBtn" onclick="toggleSound()">소리 켜기</button>
</div>

<div class="control-row">
  <select id="resolution">
    <option value="720">720p</option>
    <option value="1080" selected>1080p</option>
    <option value="4k">4K</option>
  </select>

  <button onclick="changeCamera()">카메라 전환</button>
  <button onclick="switchPhoto()">사진 스캔</button>
</div>

<div class="camera-box">
  <video id="video" autoplay muted playsinline></video>
  <div class="camera-guide"></div>
</div>

<div class="status-box">
  <div id="mainStatus">카메라를 준비하고 있습니다.</div>
  <div id="resultStatus">인식 데이터: 대기</div>
  <div id="detailStatus">카메라 연결 중...</div>
</div>

<input id="photoInput" class="photo-input"
       type="file" accept="image/*" onchange="scanPhoto(event)">

</div>

<script>
/* =========================================
   기본 설정
========================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec";

const TOKEN = "1111";

const video = document.getElementById("video");
const workerInput = document.getElementById("workerName");

let cameras = [];
let rearCameras = [];
let currentCameraIndex = -1;
let currentStream = null;

let scanning = false;
let scanBusy = false;
let scanTimer = null;
let cameraStarting = false;
let cameraVersion = 0;

let soundEnabled = false;
let lastText = "";
let lastScanTime = 0;

let resultTimer = null;
let resultSequence = 0;

let barcodeDetector = null;

const zxingReady = !!(
  window.ZXingWASM &&
  window.ZXingWASM.readBarcodes
);

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently:true
});

/* =========================================
   작업자 이름 저장
========================================= */

workerInput.value =
  localStorage.getItem("qrWorkerName") || "";

workerInput.addEventListener("input", () => {
  localStorage.setItem("qrWorkerName",workerInput.value);
});

/* =========================================
   내장 QR 인식기
========================================= */

if ("BarcodeDetector" in window) {
  try {
    barcodeDetector = new BarcodeDetector({
      formats:["qr_code"]
    });
  } catch(e) {
    barcodeDetector = null;
  }
}

/* =========================================
   상태 표시
========================================= */

function setMainStatus(text,isError=false) {
  const element = document.getElementById("mainStatus");

  element.textContent = text;
  element.classList.toggle("status-error",isError);
}

function setResultStatus(state) {
  document.getElementById("resultStatus").textContent =
    "인식 데이터: " + state;
}

/*
  전송 완료 후 1초가 지나면 대기로 복귀.
  새로운 QR이 인식되면 이전 복귀 타이머를 취소.
*/

function showResultStatus(state) {
  resultSequence++;

  const currentSequence = resultSequence;

  if (resultTimer) {
    clearTimeout(resultTimer);
    resultTimer = null;
  }

  setResultStatus(state);

  if (state === "전송 완료") {
    resultTimer = setTimeout(() => {
      if (currentSequence === resultSequence) {
        setResultStatus("대기");
      }
    },1000);
  }
}

/* =========================================
   소리 / 진동
========================================= */

function toggleSound() {
  soundEnabled = !soundEnabled;

  document.getElementById("soundBtn").textContent =
    soundEnabled ? "소리 끄기" : "소리 켜기";

  if (soundEnabled) playBeep();
}

function playBeep() {
  if (!soundEnabled) return;

  try {
    const audio = new (window.AudioContext ||
                       window.webkitAudioContext)();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = 1500;
    gain.gain.value = 0.12;

    oscillator.start();
    oscillator.stop(audio.currentTime+0.12);

    oscillator.onended = () => audio.close();
  } catch(e) {}
}

function successSignal() {
  playBeep();

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}

/* =========================================
   카메라 목록
========================================= */

async function enumerateCameras() {
  const devices =
    await navigator.mediaDevices.enumerateDevices();

  cameras = devices.filter(
    d => d.kind === "videoinput"
  );

  return cameras;
}

/* =========================================
   카메라 전면 / 후면 구분
========================================= */

function isFrontCamera(camera) {
  const label = (camera.label || "").toLowerCase();

  return (
    label.includes("front") ||
    label.includes("user") ||
    label.includes("전면")
  );
}

function isRearCamera(camera) {
  const label = (camera.label || "").toLowerCase();

  return (
    label.includes("back") ||
    label.includes("rear") ||
    label.includes("environment") ||
    label.includes("후면")
  );
}

/*
  후면 카메라 목록 구성.

  1. 이름으로 후면 카메라 확인
  2. 최초 연결에서 environment로 선택된 카메라 우선
  3. 이름이 불명확한 경우 전면 카메라를 제외한 장치 사용

  기기별 장치 이름과 순서는 다를 수 있음.
*/

function makeRearCameraList(preferredDeviceId="") {
  const labeledRear = cameras
    .map((camera,index)=>({camera,index}))
    .filter(item=>isRearCamera(item.camera));

  let list = labeledRear.map(item=>item.index);

  const preferredIndex = cameras.findIndex(
    camera=>camera.deviceId===preferredDeviceId
  );

  if (preferredIndex >= 0 &&
      !isFrontCamera(cameras[preferredIndex])) {
    list = [
      preferredIndex,
      ...list.filter(index=>index!==preferredIndex)
    ];
  }

  if (list.length === 0) {
    const unknown = cameras
      .map((camera,index)=>({camera,index}))
      .filter(item=>!isFrontCamera(item.camera))
      .map(item=>item.index);

    if (preferredIndex >= 0 &&
        unknown.includes(preferredIndex)) {
      list = [
        preferredIndex,
        ...unknown.filter(index=>index!==preferredIndex)
      ];
    } else {
      list = unknown;
    }
  }

  rearCameras = [...new Set(list)];
}

/* =========================================
   해상도 설정
========================================= */

function getResolutionConstraints() {
  const value =
    document.getElementById("resolution").value;

  if (value==="4k") {
    return {
      width:{ideal:3840},
      height:{ideal:2160}
    };
  }

  if (value==="1080") {
    return {
      width:{ideal:1920},
      height:{ideal:1080}
    };
  }

  return {
    width:{ideal:1280},
    height:{ideal:720}
  };
}

/* =========================================
   카메라 종료
========================================= */

function stopCurrentCamera() {
  scanning = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  if (currentStream) {
    currentStream.getTracks().forEach(
      track=>track.stop()
    );
  }

  currentStream = null;
  video.srcObject = null;
}

/* =========================================
   카메라 연결
========================================= */

async function openCamera(index,version) {
  if (index<0 || index>=cameras.length) {
    throw new Error("카메라가 없습니다.");
  }

  const device = cameras[index];

  if (isFrontCamera(device)) {
    throw new Error("전면 카메라 선택 제한");
  }

  const constraints = {
    audio:false,
    video:{
      deviceId:{exact:device.deviceId},
      facingMode:{ideal:"environment"},
      ...getResolutionConstraints()
    }
  };

  const stream =
    await navigator.mediaDevices.getUserMedia(
      constraints
    );

  if (version!==cameraVersion) {
    stream.getTracks().forEach(t=>t.stop());
    throw new Error("카메라 연결 취소");
  }

  currentStream = stream;
  currentCameraIndex = index;

  video.srcObject = stream;
  await video.play();

  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings();

  const capabilities =
    track.getCapabilities ? track.getCapabilities() : {};

  /* 연속 자동 초점 */
  if (capabilities.focusMode &&
      capabilities.focusMode.includes("continuous")) {
    try {
      await track.applyConstraints({
        advanced:[{focusMode:"continuous"}]
      });
    } catch(e) {}
  }

  const fps = settings.frameRate
    ? Math.round(settings.frameRate)
    : "-";

  setDetailStatus(
    `${settings.width||"-"}x${settings.height||"-"} / `+
    `${fps}fps / 카메라 ${index+1}: `+
    `${device.label||"후면 카메라"} / `+
    `인식기: ${zxingReady?"ZXing-WASM":"내장 인식기 확인"}`
  );

  scanning = true;
  scanLoop();
}

/* =========================================
   최초 카메라 연결
========================================= */

async function startCameraSelection() {
  if (cameraStarting) return;

  cameraStarting = true;
  const version = ++cameraVersion;

  stopCurrentCamera();

  setMainStatus("카메라를 연결하고 있습니다.");
  showResultStatus("대기");
  setDetailStatus("후면 카메라 확인 중...");

  try {
    /*
      facingMode environment를 이용해
      브라우저가 선택한 후면 카메라를 우선 확보
    */

    const tempStream =
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"environment"}
        }
      });

    const tempTrack = tempStream.getVideoTracks()[0];
    const preferredDeviceId =
      tempTrack.getSettings().deviceId || "";

    tempStream.getTracks().forEach(t=>t.stop());

    if (version!==cameraVersion) return;

    await enumerateCameras();

    makeRearCameraList(preferredDeviceId);

    if (rearCameras.length===0) {
      throw new Error("후면 카메라를 확인할 수 없습니다.");
    }

    let connected = false;
    let lastError = null;

    for (const index of rearCameras) {
      if (version!==cameraVersion) return;

      try {
        await openCamera(index,version);
        connected = true;
        break;
      } catch(error) {
        lastError = error;
        stopCurrentCamera();
      }
    }

    if (!connected) {
      throw lastError || new Error("카메라 연결 실패");
    }

    setMainStatus("QR 코드를 비춰 주세요");

  } catch(error) {
    if (version===cameraVersion) {
      setMainStatus("카메라 연결 실패");
      setDetailStatus("카메라 권한 또는 연결 상태를 확인해 주세요.");
    }
  } finally {
    if (version===cameraVersion) {
      cameraStarting = false;
    }
  }
}

/* =========================================
   수동 카메라 전환
========================================= */

async function changeCamera() {
  if (cameraStarting) return;

  const oldDeviceId =
    currentCameraIndex>=0 && cameras[currentCameraIndex]
      ? cameras[currentCameraIndex].deviceId
      : "";

  cameraStarting = true;
  const version = ++cameraVersion;

  setMainStatus("카메라 전환 중...");
  stopCurrentCamera();

  try {
    /* 기존 카메라 장치 해제 대기 */
    await new Promise(resolve=>setTimeout(resolve,1000));

    if (version!==cameraVersion) return;

    await enumerateCameras();

    makeRearCameraList(oldDeviceId);

    const oldIndex = cameras.findIndex(
      camera=>camera.deviceId===oldDeviceId
    );

    if (rearCameras.length===0) {
      throw new Error("후면 카메라 없음");
    }

    const currentPosition = rearCameras.indexOf(oldIndex);

    if (rearCameras.length===1) {
      if (oldIndex>=0) {
        await openCamera(oldIndex,version);
      }

      setMainStatus("전환 가능한 후면 카메라가 없습니다.");
      setDetailStatus("사용 가능한 후면 카메라가 1개입니다.");
      return;
    }

    const nextPosition = currentPosition<0
      ? 0
      : (currentPosition+1)%rearCameras.length;

    const nextIndex = rearCameras[nextPosition];

    await openCamera(nextIndex,version);

    setMainStatus("QR 코드를 비춰 주세요");
    setDetailStatus("후면 카메라로 전환했습니다.");

  } catch(error) {
    if (version!==cameraVersion) return;

    /* 실제 오류 코드는 표시하지 않음 */
    setMainStatus("카메라 전환 실패",true);

    stopCurrentCamera();

    try {
      await new Promise(resolve=>setTimeout(resolve,1000));

      if (version!==cameraVersion) return;

      await enumerateCameras();
      makeRearCameraList(oldDeviceId);

      const restoreIndex = cameras.findIndex(
        camera=>camera.deviceId===oldDeviceId
      );

      if (restoreIndex<0 ||
          isFrontCamera(cameras[restoreIndex])) {
        throw new Error("기존 카메라 확인 실패");
      }

      await openCamera(restoreIndex,version);

      setMainStatus("카메라 전환 실패",true);
      setDetailStatus("기존 카메라로 복구했습니다.");

    } catch(restoreError) {
      if (version!==cameraVersion) return;

      setMainStatus("카메라 전환 실패",true);
      setDetailStatus("기존 카메라로 복구하지 못했습니다.");
    }

  } finally {
    if (version===cameraVersion) {
      cameraStarting = false;
    }
  }
}

/* =========================================
   해상도 변경
========================================= */

document.getElementById("resolution")
  .addEventListener("change",async()=>{
    if (currentCameraIndex<0 || cameraStarting) return;

    const oldDeviceId =
      cameras[currentCameraIndex].deviceId;

    cameraStarting = true;
    const version = ++cameraVersion;

    stopCurrentCamera();

    try {
      await enumerateCameras();

      const index = cameras.findIndex(
        camera=>camera.deviceId===oldDeviceId
      );

      if (index<0) throw new Error("카메라 없음");

      await openCamera(index,version);

      setMainStatus("QR 코드를 비춰 주세요");

    } catch(error) {
      setMainStatus("해상도 변경 실패");
      setDetailStatus("카메라 해상도를 변경할 수 없습니다.");

    } finally {
      if (version===cameraVersion) {
        cameraStarting = false;
      }
    }
  });

/* =========================================
   선명도 참고값
========================================= */

function calculateSharpness(imageData) {
  const w = imageData.width;
  const h = imageData.height;
  const data = imageData.data;

  let sum = 0;
  let sum2 = 0;
  let count = 0;

  for (let y=1;y<h-1;y+=3) {
    for (let x=1;x<w-1;x+=3) {
      const i=(y*w+x)*4;

      const c=data[i];
      const up=data[((y-1)*w+x)*4];
      const down=data[((y+1)*w+x)*4];
      const left=data[(y*w+x-1)*4];
      const right=data[(y*w+x+1)*4];

      const lap=4*c-up-down-left-right;

      sum+=lap;
      sum2+=lap*lap;
      count++;
    }
  }

  if (!count) return 0;

  const mean=sum/count;

  return Math.round(sum2/count-mean*mean);
}

/* =========================================
   이미지 전처리
========================================= */

function makeImageVariants(sourceCanvas) {
  const variants=[];

  const w=sourceCanvas.width;
  const h=sourceCanvas.height;

  variants.push(sourceCanvas);

  /* 명암 보정 */
  const enhanced=document.createElement("canvas");
  enhanced.width=w;
  enhanced.height=h;

  const ectx=enhanced.getContext("2d",{
    willReadFrequently:true
  });

  ectx.drawImage(sourceCanvas,0,0);

  const image=ectx.getImageData(0,0,w,h);
  const d=image.data;

  for(let i=0;i<d.length;i+=4) {
    for(let c=0;c<3;c++) {
      d[i+c]=Math.max(
        0,
        Math.min(255,(d[i+c]-128)*1.35+128)
      );
    }
  }

  ectx.putImageData(image,0,0);
  variants.push(enhanced);

  /* 반전 */
  const inverted=document.createElement("canvas");
  inverted.width=w;
  inverted.height=h;

  const ictx=inverted.getContext("2d",{
    willReadFrequently:true
  });

  ictx.drawImage(enhanced,0,0);

  const inv=ictx.getImageData(0,0,w,h);

  for(let i=0;i<inv.data.length;i+=4) {
    inv.data[i]=255-inv.data[i];
    inv.data[i+1]=255-inv.data[i+1];
    inv.data[i+2]=255-inv.data[i+2];
  }

  ictx.putImageData(inv,0,0);
  variants.push(inverted);

  /* 중앙 72% 영역 */
  const crop=document.createElement("canvas");

  crop.width=Math.round(w*0.72);
  crop.height=Math.round(h*0.72);

  const cctx=crop.getContext("2d",{
    willReadFrequently:true
  });

  cctx.drawImage(
    sourceCanvas,
    w*0.14,h*0.14,
    w*0.72,h*0.72,
    0,0,crop.width,crop.height
  );

  variants.push(crop);

  return variants;
}

/* =========================================
   QR 판독
========================================= */

async function decodeCanvas(sourceCanvas) {
  const variants=makeImageVariants(sourceCanvas);

  if (barcodeDetector) {
    for (const variant of variants) {
      try {
        const results=await barcodeDetector.detect(variant);

        if(results.length && results[0].rawValue) {
          return results[0].rawValue;
        }
      } catch(e) {}
    }
  }

  if(zxingReady) {
    for(const variant of variants) {
      try {
        const vctx=variant.getContext("2d",{
          willReadFrequently:true
        });

        const imageData=vctx.getImageData(
          0,0,variant.width,variant.height
        );

        const results=await window.ZXingWASM.readBarcodes(
          imageData,
          {
            formats:["QRCode"],
            tryHarder:true,
            maxNumberOfSymbols:1
          }
        );

        if(results.length && results[0].text) {
          return results[0].text;
        }
      } catch(e) {}
    }
  }

  return null;
}

/* =========================================
   실시간 QR 스캔
========================================= */

async function scanLoop() {
  if(!scanning || !currentStream) return;
  if(scanBusy) return;

  scanBusy=true;

  try {
    if(video.readyState>=2 &&
       video.videoWidth>0 &&
       video.videoHeight>0) {

      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;

      ctx.drawImage(
        video,0,0,canvas.width,canvas.height
      );

      const imageData=ctx.getImageData(
        0,0,canvas.width,canvas.height
      );

      const sharpness=calculateSharpness(imageData);

      const result=await decodeCanvas(canvas);

      if(result) {
        processDecodedText(result);
      } else {
        if(!document.getElementById("mainStatus")
             .classList.contains("status-error")) {
          setMainStatus("QR 코드를 비춰 주세요");
        }

        setDetailStatus(
          `선명도 참고값: ${sharpness} / `+
          `인식기: ${barcodeDetector?"내장인식기":""}`+
          `${barcodeDetector&&zxingReady?" + ":""}`+
          `${zxingReady?"ZXing-WASM":""}`
        );
      }
    }
  } catch(e) {
    console.log(e);
  } finally {
    scanBusy=false;

    if(scanning) {
      scanTimer=setTimeout(scanLoop,120);
    }
  }
}

/* =========================================
   QR 인식 후 처리
========================================= */

function processDecodedText(text) {
  const now=Date.now();

  /* 같은 QR 반복 인식 방지 */
  if(text===lastText && now-lastScanTime<3000) {
    return;
  }

  lastText=text;
  lastScanTime=now;

  successSignal();

  setMainStatus("QR 코드 인식 완료");
  showResultStatus("전송 중");

  sendToSheet(text);
}

/* =========================================
   Google Sheets 전송
========================================= */

async function sendToSheet(text) {
  const name=workerInput.value.trim();

  if(!name) {
    showResultStatus("대기");
    setMainStatus("작업자 이름 입력 필요");
    return;
  }

  try {
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        token:TOKEN,
        text:text,
        name:name
      })
    });

    showResultStatus("전송 완료");
    setMainStatus("QR 코드 인식 완료");

  } catch(error) {
    showResultStatus("대기");
    setMainStatus("전송 오류");
  }
}

/* =========================================
   사진 스캔
========================================= */

function switchPhoto() {
  document.getElementById("photoInput").click();
}

async function scanPhoto(event) {
  const file=event.target.files[0];

  if(!file) return;

  setMainStatus("사진 분석 중...");
  showResultStatus("대기");

  try {
    const bitmap=await createImageBitmap(file);

    const photoCanvas=document.createElement("canvas");
    photoCanvas.width=bitmap.width;
    photoCanvas.height=bitmap.height;

    const photoCtx=photoCanvas.getContext("2d",{
      willReadFrequently:true
    });

    photoCtx.drawImage(
      bitmap,0,0,bitmap.width,bitmap.height
    );

    const result=await decodeCanvas(photoCanvas);

    if(result) {
      processDecodedText(result);
    } else {
      setMainStatus("QR 코드를 찾지 못했습니다.");
      showResultStatus("대기");
    }

    bitmap.close();

  } catch(error) {
    setMainStatus("사진 분석 실패");
    showResultStatus("대기");
  }

  event.target.value="";
}

/* =========================================
   앱 시작
========================================= */

window.addEventListener("load",()=>{
  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia) {

    setMainStatus("카메라 기능을 사용할 수 없습니다.");
    setDetailStatus("HTTPS 환경에서 접속해 주세요.");

    return;
  }

  startCameraSelection();
});

/* 페이지 종료 시 카메라 종료 */
window.addEventListener("pagehide",()=>{
  stopCurrentCamera();
});
