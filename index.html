
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battery QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.7/dist/iife/reader/index.js"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:8px;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  color:#222;
  font-size:14px;
}

.container {
  width:100%;
  max-width:650px;
  margin:auto;
}

h3 {
  margin:2px 0 8px;
  font-size:18px;
}

/* 작업자 / 소리 설정 한 줄 */
.top-row {
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:7px;
}

.name-input {
  flex:1;
  min-width:0;
  height:36px;
  padding:5px 8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

button, select {
  height:36px;
  border:1px solid #bbb;
  border-radius:6px;
  background:white;
  padding:0 9px;
  font-size:13px;
}

button:active {
  background:#e2e8f0;
}

#soundBtn {
  white-space:nowrap;
  min-width:100px;
}

/* 조작 버튼 */
.control-row {
  display:flex;
  gap:5px;
  margin-bottom:7px;
}

.control-row select {
  flex:1;
  min-width:0;
}

.control-row button {
  white-space:nowrap;
}

#zoomArea {
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 2px 7px;
  font-size:12px;
}

#zoomSlider {
  flex:1;
  min-width:0;
}

/* 카메라 영역: 세로 높이 제한 */
.camera-box {
  width:100%;
  height:clamp(155px, 30vh, 260px);
  max-height:260px;
  background:#111;
  border-radius:8px;
  overflow:hidden;
  position:relative;
}

#video {
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#111;
}

.camera-guide {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:68%;
  height:75%;
  border:2px solid rgba(0,255,100,.75);
  border-radius:10px;
  pointer-events:none;
}

/* 상태창 */
.status-box {
  margin-top:7px;
  padding:9px 10px;
  border-radius:7px;
  background:white;
  border:1px solid #ddd;
}

#mainStatus {
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

#resultStatus {
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

#detailStatus {
  font-size:11px;
  color:#666;
  margin-top:5px;
  line-height:1.4;
}

.bottom-row {
  display:flex;
  gap:6px;
  margin-top:7px;
}

.bottom-row button {
  flex:1;
}

.photo-input {
  display:none;
}

@media (max-width:380px) {
  body { padding:5px; }
  .top-row, .control-row { gap:4px; }
  button, select { padding:0 6px; font-size:12px; }
  #soundBtn { min-width:88px; }
  .camera-box { height:25vh; min-height:145px; }
}
</style>
</head>

<body>
<div class="container">

<h3>배터리 QR Scanner <small style="font-size:11px;color:#777;">v0.11</small></h3>

<!-- 작업자 이름 / 소리 설정 -->
<div class="top-row">
  <input id="workerName" class="name-input"
         type="text" placeholder="작업자 이름 입력">
  <button id="soundBtn" onclick="toggleSound()">소리 켜기</button>
</div>

<!-- 카메라 / 해상도 -->
<div class="control-row">
  <select id="resolution">
    <option value="720">720p</option>
    <option value="1080" selected>1080p</option>
    <option value="4k">4K</option>
  </select>

  <button onclick="changeCamera()">카메라 전환</button>
  <button onclick="switchPhoto()">사진 스캔</button>
</div>

<!-- 줌 -->
<div id="zoomArea">
  <span>확대</span>
  <input id="zoomSlider" type="range"
         min="1" max="1" step="0.1" value="1"
         oninput="changeZoom(this.value)">
  <span id="zoomValue">1.0x</span>
</div>

<!-- 카메라 -->
<div class="camera-box">
  <video id="video" autoplay muted playsinline></video>
  <div class="camera-guide"></div>
</div>

<!-- 상태창: 카메라 바로 아래 -->
<div class="status-box">
  <div id="mainStatus">카메라를 준비하고 있습니다.</div>
  <div id="resultStatus">인식 데이터: 대기 중</div>
  <div id="detailStatus">카메라 연결 중...</div>
</div>

<div class="bottom-row">
  <button onclick="startCameraSelection()">카메라 다시 연결</button>
  <button onclick="copyResult()">인식 데이터 복사</button>
</div>

<input id="photoInput" class="photo-input"
       type="file" accept="image/*" onchange="scanPhoto(event)">

</div>

<script>
/* =========================================
   기본 설정
========================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec";

const TOKEN = "1111";

const video = document.getElementById("video");
const workerInput = document.getElementById("workerName");

let cameras = [];
let currentCameraIndex = -1;
let currentStream = null;

let scanning = false;
let scanBusy = false;
let scanTimer = null;
let cameraStarting = false;
let cameraVersion = 0;

let soundEnabled = false;
let lastText = "";
let lastScanTime = 0;
let lastResult = "";

let barcodeDetector = null;
let zxingReady = !!(window.ZXingWASM &&
                    window.ZXingWASM.readBarcodes);

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently:true
});

const photoCanvas = document.createElement("canvas");
const photoCtx = photoCanvas.getContext("2d", {
  willReadFrequently:true
});

/* 작업자 이름 저장 */
workerInput.value = localStorage.getItem("qrWorkerName") || "";

workerInput.addEventListener("input", () => {
  localStorage.setItem("qrWorkerName", workerInput.value);
});

/* BarcodeDetector 지원 여부 확인 */
if ("BarcodeDetector" in window) {
  try {
    barcodeDetector = new BarcodeDetector({
      formats:["qr_code"]
    });
  } catch(e) {
    barcodeDetector = null;
  }
}

/* =========================================
   화면 상태 표시
========================================= */

function setMainStatus(text) {
  document.getElementById("mainStatus").textContent = text;
}

function setResultStatus(text) {
  document.getElementById("resultStatus").textContent = text;
}

function setDetailStatus(text) {
  document.getElementById("detailStatus").textContent = text;
}

/* =========================================
   소리 / 진동
========================================= */

function toggleSound() {
  soundEnabled = !soundEnabled;

  document.getElementById("soundBtn").textContent =
    soundEnabled ? "소리 끄기" : "소리 켜기";

  if (soundEnabled) playBeep();
}

function playBeep() {
  if (!soundEnabled) return;

  try {
    const audio = new (window.AudioContext ||
                       window.webkitAudioContext)();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = 1500;
    gain.gain.value = 0.12;

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.12);

    oscillator.onended = () => audio.close();
  } catch(e) {}
}

function successSignal() {
  playBeep();

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}

/* =========================================
   카메라 목록 확인
========================================= */

async function enumerateCameras() {
  const devices =
    await navigator.mediaDevices.enumerateDevices();

  cameras = devices.filter(
    d => d.kind === "videoinput"
  );

  return cameras;
}

/* =========================================
   카메라 해상도 설정
========================================= */

function getResolutionConstraints() {
  const value =
    document.getElementById("resolution").value;

  if (value === "4k") {
    return {
      width:{ideal:3840},
      height:{ideal:2160}
    };
  }

  if (value === "1080") {
    return {
      width:{ideal:1920},
      height:{ideal:1080}
    };
  }

  return {
    width:{ideal:1280},
    height:{ideal:720}
  };
}

/* =========================================
   기존 카메라 종료
========================================= */

function stopCurrentCamera() {
  scanning = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  if (currentStream) {
    currentStream.getTracks().forEach(
      track => track.stop()
    );
  }

  currentStream = null;
  video.srcObject = null;
}

/* =========================================
   카메라 실행
========================================= */

async function openCamera(index, version) {
  if (index < 0 || index >= cameras.length) {
    throw new Error("선택한 카메라가 없습니다.");
  }

  const device = cameras[index];

  const constraints = {
    audio:false,
    video:{
      deviceId:{exact:device.deviceId},
      ...getResolutionConstraints()
    }
  };

  const stream =
    await navigator.mediaDevices.getUserMedia(
      constraints
    );

  if (version !== cameraVersion) {
    stream.getTracks().forEach(t => t.stop());
    throw new Error("카메라 선택이 변경되었습니다.");
  }

  currentStream = stream;
  currentCameraIndex = index;

  video.srcObject = stream;
  await video.play();

  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings();
  const capabilities =
    track.getCapabilities ? track.getCapabilities() : {};

  /* 연속 자동 초점 */
  if (capabilities.focusMode &&
      capabilities.focusMode.includes("continuous")) {
    try {
      await track.applyConstraints({
        advanced:[{focusMode:"continuous"}]
      });
    } catch(e) {}
  }

  /* 줌 지원 시 슬라이더 설정 */
  const zoomSlider =
    document.getElementById("zoomSlider");

  if (capabilities.zoom) {
    zoomSlider.min = capabilities.zoom.min;
    zoomSlider.max = capabilities.zoom.max;
    zoomSlider.step = capabilities.zoom.step || 0.1;
    zoomSlider.value =
      Math.max(capabilities.zoom.min, 1);

    document.getElementById("zoomValue").textContent =
      Number(zoomSlider.value).toFixed(1) + "x";
  } else {
    zoomSlider.min = 1;
    zoomSlider.max = 1;
    zoomSlider.value = 1;
  }

  const fps = settings.frameRate
    ? Math.round(settings.frameRate)
    : "-";

  setDetailStatus(
    `${settings.width || "-"}x${settings.height || "-"} / ` +
    `${fps}fps / 카메라 ${index + 1}: ` +
    `${device.label || "이름 확인 불가"} / ` +
    `ZXing-WASM ${zxingReady ? "사용 가능" : "미사용"}`
  );

  scanning = true;
  scanLoop();
}

/* =========================================
   최초 카메라 자동 선택
   1. 권한 확보
   2. 카메라 목록 확인
   3. 두 번째 카메라 우선
   4. 실패 시 첫 번째 카메라
========================================= */

async function startCameraSelection() {
  if (cameraStarting) return;

  cameraStarting = true;
  const version = ++cameraVersion;

  stopCurrentCamera();

  setMainStatus("카메라를 연결하고 있습니다.");
  setResultStatus("인식 데이터: 대기 중");
  setDetailStatus("카메라 목록 확인 중...");

  try {
    /* 권한 확보를 위한 임시 카메라 실행 */
    const tempStream =
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{facingMode:{ideal:"environment"}}
      });

    tempStream.getTracks().forEach(t => t.stop());

    if (version !== cameraVersion) return;

    await enumerateCameras();

    if (cameras.length === 0) {
      throw new Error("사용 가능한 카메라가 없습니다.");
    }

    /* 두 번째 카메라 우선 */
    let preferredIndex =
      cameras.length >= 2 ? 1 : 0;

    try {
      await openCamera(preferredIndex, version);
    } catch(firstError) {
      if (version !== cameraVersion) return;

      /* 두 번째 카메라 실패 시 첫 번째 */
      if (preferredIndex !== 0) {
        stopCurrentCamera();

        await enumerateCameras();

        await openCamera(0, version);
      } else {
        throw firstError;
      }
    }

    setMainStatus("QR 코드를 비춰 주세요");

  } catch(error) {
    if (version === cameraVersion) {
      setMainStatus("카메라 연결 실패");
      setDetailStatus(error.message);
    }
  } finally {
    if (version === cameraVersion) {
      cameraStarting = false;
    }
  }
}

/* =========================================
   수동 카메라 전환
   모든 카메라를 순환
========================================= */

async function changeCamera() {
  if (cameraStarting) return;

  const oldIndex = currentCameraIndex;
  const nextIndex =
    cameras.length > 0
      ? (oldIndex + 1) % cameras.length
      : 0;

  if (cameras.length < 2) {
    setDetailStatus("전환 가능한 다른 카메라가 없습니다.");
    return;
  }

  cameraStarting = true;
  const version = ++cameraVersion;

  stopCurrentCamera();

  setMainStatus("카메라 전환 중...");

  try {
    await openCamera(nextIndex, version);
    setMainStatus("QR 코드를 비춰 주세요");

  } catch(error) {
    if (version !== cameraVersion) return;

    setMainStatus("카메라 전환 실패");

    /* 기존 카메라로 복구 */
    try {
      await enumerateCameras();
      await openCamera(oldIndex, version);
      setMainStatus("기존 카메라로 복구했습니다.");
    } catch(e) {
      setDetailStatus("카메라를 다시 연결해 주세요.");
    }

  } finally {
    if (version === cameraVersion) {
      cameraStarting = false;
    }
  }
}

/* =========================================
   해상도 변경
========================================= */

document.getElementById("resolution")
  .addEventListener("change", async () => {
    if (currentCameraIndex < 0) return;

    const index = currentCameraIndex;
    cameraStarting = true;
    const version = ++cameraVersion;

    stopCurrentCamera();

    try {
      await enumerateCameras();
      await openCamera(index, version);
      setMainStatus("QR 코드를 비춰 주세요");
    } catch(e) {
      setMainStatus("해상도 변경 실패");
      setDetailStatus(e.message);
    } finally {
      if (version === cameraVersion) {
        cameraStarting = false;
      }
    }
  });

/* =========================================
   줌 조절
========================================= */

async function changeZoom(value) {
  document.getElementById("zoomValue").textContent =
    Number(value).toFixed(1) + "x";

  if (!currentStream) return;

  const track = currentStream.getVideoTracks()[0];

  try {
    await track.applyConstraints({
      advanced:[{zoom:Number(value)}]
    });
  } catch(e) {}
}

/* =========================================
   선명도 참고값
========================================= */

function calculateSharpness(imageData) {
  const w = imageData.width;
  const h = imageData.height;
  const data = imageData.data;

  let sum = 0;
  let sum2 = 0;
  let count = 0;

  for (let y = 1; y < h - 1; y += 3) {
    for (let x = 1; x < w - 1; x += 3) {
      const i = (y * w + x) * 4;

      const c = data[i];
      const up = data[((y-1)*w+x)*4];
      const down = data[((y+1)*w+x)*4];
      const left = data[(y*w+x-1)*4];
      const right = data[(y*w+x+1)*4];

      const lap = 4*c - up - down - left - right;

      sum += lap;
      sum2 += lap * lap;
      count++;
    }
  }

  if (!count) return 0;

  const mean = sum / count;
  return Math.round(sum2 / count - mean * mean);
}

/* =========================================
   이미지 전처리
   - 원본 전체
   - 명암 보정
   - 반전
   - 중앙 72% 영역
========================================= */

function makeImageVariants(sourceCanvas) {
  const variants = [];

  const w = sourceCanvas.width;
  const h = sourceCanvas.height;

  /* 원본 */
  variants.push(sourceCanvas);

  /* 명암 보정 */
  const enhanced = document.createElement("canvas");
  enhanced.width = w;
  enhanced.height = h;

  const ectx = enhanced.getContext("2d", {
    willReadFrequently:true
  });

  ectx.drawImage(sourceCanvas, 0, 0);

  const image = ectx.getImageData(0, 0, w, h);
  const d = image.data;

  for (let i = 0; i < d.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      d[i+c] = Math.max(
        0,
        Math.min(255, (d[i+c] - 128) * 1.35 + 128)
      );
    }
  }

  ectx.putImageData(image, 0, 0);
  variants.push(enhanced);

  /* 반전 */
  const inverted = document.createElement("canvas");
  inverted.width = w;
  inverted.height = h;

  const ictx = inverted.getContext("2d", {
    willReadFrequently:true
  });

  ictx.drawImage(enhanced, 0, 0);

  const inv = ictx.getImageData(0, 0, w, h);

  for (let i = 0; i < inv.data.length; i += 4) {
    inv.data[i] = 255 - inv.data[i];
    inv.data[i+1] = 255 - inv.data[i+1];
    inv.data[i+2] = 255 - inv.data[i+2];
  }

  ictx.putImageData(inv, 0, 0);
  variants.push(inverted);

  /* 중앙 72% 영역 */
  const crop = document.createElement("canvas");
  crop.width = Math.round(w * 0.72);
  crop.height = Math.round(h * 0.72);

  const cctx = crop.getContext("2d", {
    willReadFrequently:true
  });

  cctx.drawImage(
    sourceCanvas,
    w * 0.14,
    h * 0.14,
    w * 0.72,
    h * 0.72,
    0,
    0,
    crop.width,
    crop.height
  );

  variants.push(crop);

  return variants;
}

/* =========================================
   QR 판독
========================================= */

async function decodeCanvas(sourceCanvas) {
  const variants = makeImageVariants(sourceCanvas);

  /* 내장 BarcodeDetector 우선 */
  if (barcodeDetector) {
    for (const variant of variants) {
      try {
        const results =
          await barcodeDetector.detect(variant);

        if (results.length && results[0].rawValue) {
          return results[0].rawValue;
        }
      } catch(e) {}
    }
  }

  /* ZXing-WASM */
  if (zxingReady) {
    for (const variant of variants) {
      try {
        const vctx = variant.getContext("2d", {
          willReadFrequently:true
        });

        const imageData = vctx.getImageData(
          0, 0, variant.width, variant.height
        );

        const results =
          await window.ZXingWASM.readBarcodes(
            imageData,
            {
              formats:["QRCode"],
              tryHarder:true,
              maxNumberOfSymbols:1
            }
          );

        if (results.length && results[0].text) {
          return results[0].text;
        }
      } catch(e) {}
    }
  }

  return null;
}

/* =========================================
   실시간 카메라 스캔
========================================= */

async function scanLoop() {
  if (!scanning || !currentStream) return;
  if (scanBusy) return;

  scanBusy = true;

  try {
    if (video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0) {

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(
        video, 0, 0,
        canvas.width, canvas.height
      );

      const imageData =
        ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

      const sharpness =
        calculateSharpness(imageData);

      const result = await decodeCanvas(canvas);

      if (result) {
        processDecodedText(result);
      } else {
        setMainStatus("QR 코드를 비춰 주세요");
        setDetailStatus(
          `선명도 참고값: ${sharpness} / ` +
          `인식기: ${barcodeDetector ? "내장인식기" : ""}` +
          `${barcodeDetector && zxingReady ? " + " : ""}` +
          `${zxingReady ? "ZXing-WASM" : ""}`
        );
      }
    }
  } catch(e) {
    console.log(e);
  } finally {
    scanBusy = false;

    if (scanning) {
      scanTimer = setTimeout(scanLoop, 120);
    }
  }
}

/* =========================================
   QR 인식 후 처리
========================================= */

function processDecodedText(text) {
  const now = Date.now();

  /* 동일 QR 반복 전송 방지 */
  if (text === lastText && now - lastScanTime < 3000) {
    return;
  }

  lastText = text;
  lastScanTime = now;
  lastResult = text;

  successSignal();

  setMainStatus("QR 코드 인식 완료");
  setResultStatus("인식 데이터: 전송 중...");

  sendToSheet(text);
}

/* =========================================
   Google Sheets 전송
========================================= */

async function sendToSheet(text) {
  const name = workerInput.value.trim();

  if (!name) {
    setResultStatus("인식 데이터: 작업자 이름을 입력해 주세요.");
    setMainStatus("작업자 이름 입력 필요");
    return;
  }

  try {
    await fetch(SCRIPT_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        token:TOKEN,
        text:text,
        name:name
      })
    });

    /*
      no-cors 방식은 서버 응답 내용을 읽을 수 없으므로
      화면에는 전송 요청 완료로 표시
    */
    setResultStatus("인식 데이터: 전송 요청 완료");
    setMainStatus("QR 코드 인식 완료");

  } catch(error) {
    setResultStatus("인식 데이터: 전송 요청 실패");
    setMainStatus("전송 오류");
  }
}

/* =========================================
   사진 스캔
========================================= */

function switchPhoto() {
  document.getElementById("photoInput").click();
}

async function scanPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  setMainStatus("사진 분석 중...");
  setResultStatus("인식 데이터: 분석 중...");

  try {
    const bitmap = await createImageBitmap(file);

    photoCanvas.width = bitmap.width;
    photoCanvas.height = bitmap.height;

    photoCtx.drawImage(
      bitmap, 0, 0,
      bitmap.width, bitmap.height
    );

    const result = await decodeCanvas(photoCanvas);

    if (result) {
      processDecodedText(result);
    } else {
      setMainStatus("QR 코드를 찾지 못했습니다.");
      setResultStatus("인식 데이터: 인식 실패");
    }

    bitmap.close();

  } catch(error) {
    setMainStatus("사진 분석 실패");
    setResultStatus(error.message);
  }

  event.target.value = "";
}

/* =========================================
   결과 복사
========================================= */

async function copyResult() {
  if (!lastResult) {
    setResultStatus("복사할 인식 데이터가 없습니다.");
    return;
  }

  try {
    await navigator.clipboard.writeText(lastResult);
    setResultStatus("인식 데이터: 클립보드 복사 완료");
  } catch(e) {
    setResultStatus("복사할 수 없습니다.");
  }
}

/* =========================================
   앱 시작
========================================= */

window.addEventListener("load", () => {
  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    setMainStatus("카메라 기능을 사용할 수 없습니다.");
    setDetailStatus("HTTPS 환경에서 접속해 주세요.");
    return;
  }

  startCameraSelection();
});

/* 페이지 종료 시 카메라 종료 */
window.addEventListener("pagehide", () => {
  stopCurrentCamera();
});

</script>
