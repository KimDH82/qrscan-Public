
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGM 배터리 QR 스캐너</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.7/dist/iife/reader/index.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f3f5f7;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
}

h2 {
  text-align: center;
  font-size: 22px;
  margin: 8px 0 14px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.row:last-child { margin-bottom: 0; }

.row label {
  min-width: 82px;
  font-size: 14px;
  font-weight: bold;
}

input, select, button {
  font-size: 15px;
  border-radius: 7px;
  padding: 10px;
}

input, select {
  min-width: 0;
  flex: 1;
  border: 1px solid #ccc;
  background: white;
}

button {
  border: none;
  background: #2864d7;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.camera-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.camera-buttons button {
  flex: 1;
  min-height: 44px;
}

.camera-area {
  width: 100%;
  height: clamp(300px, 55vh, 520px);
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-guide {
  position: absolute;
  left: 12%;
  top: 12%;
  width: 76%;
  height: 76%;
  border: 2px solid rgba(255,255,255,0.75);
  border-radius: 12px;
  pointer-events: none;
}

#mainStatus {
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  padding: 13px 8px;
  border-radius: 9px;
  background: #e8edf5;
  color: #333;
}

#mainStatus.wait {
  color: #333;
  background: #e8edf5;
}

#mainStatus.sending {
  color: #0758bd;
  background: #e4f0ff;
  animation: pulse 1s infinite;
}

#mainStatus.done {
  color: #147a35;
  background: #e4f6e9;
}

#mainStatus.error {
  color: #c62828;

}

@keyframes pulse {
  50% { opacity: 0.55; }
}

#detailStatus {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-top: 8px;
  min-height: 18px;
}

#recentResult {
  background: #f1f6ff;
  border-radius: 8px;
  padding: 12px;
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-all;
}

#recentResult strong {
  color: #174ea6;
}

.hidden { display: none !important; }
</style>
</head>

<body>
<div class="container">

  <h2>KGM 배터리 QR 스캐너</h2>

  <!-- 작업자 및 해상도 -->
  <div class="panel">

    <div class="row">
      <label for="workerName">작업자 이름</label>
      <input id="workerName" type="text" placeholder="작업자 이름 입력">
    </div>

    <div class="row">
      <label for="resolution">카메라 해상도</label>
      <select id="resolution">
        <option value="1280">1280 × 720</option>
        <option value="1920" selected>1920 × 1080</option>
        <option value="2560">2560 × 1440</option>
      </select>
    </div>

  </div>

  <!-- 카메라 -->
  <div class="panel">

    <div class="camera-buttons">
      <button id="switchCameraBtn" type="button">카메라 전환</button>
      <button id="photoBtn" type="button">사진으로 QR 인식</button>
    </div>

    <div class="camera-area">
      <video id="video" autoplay muted playsinline></video>
      <div class="camera-guide"></div>
    </div>

    <input id="photoInput" type="file" accept="image/*" class="hidden">

  </div>

  <!-- 처리 상태 -->
  <div class="panel">

    <div id="mainStatus" class="wait">카메라 연결 준비 중</div>

    <div id="detailStatus">카메라 연결을 시작합니다.</div>

    <div id="recentResult">
      <strong>최근 처리 결과</strong><br>
      최근 처리: 없음
    </div>

  </div>

</div>

<script>

/* =====================================================
   1. 기본 설정
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzoUB5_OGEZz_mlVeLWBP8-DeLDQQ6NQIEQ6XM_JjDyyV6uTi6mkbVRE0IJucNpn4kYDw/exec";

const TOKEN = "1111";

const video = document.getElementById("video");
const mainStatus = document.getElementById("mainStatus");
const detailStatus = document.getElementById("detailStatus");
const recentResult = document.getElementById("recentResult");

const workerName = document.getElementById("workerName");
const resolutionSelect = document.getElementById("resolution");

const switchCameraBtn = document.getElementById("switchCameraBtn");
const photoBtn = document.getElementById("photoBtn");
const photoInput = document.getElementById("photoInput");

let currentStream = null;
let cameraList = [];
let currentCameraIndex = -1;

let cameraStarting = false;
let cameraChanging = false;
let scanning = false;
let processing = false;

let lastText = "";
let lastScanTime = 0;
let lastScanLoopTime = 0;

let barcodeDetector = null;
let barcodeDetectorAvailable = false;

const scanCanvas = document.createElement("canvas");

const ZXING_OPTIONS = {
  formats: ["QRCode"],
  tryHarder: true,
  maxNumberOfSymbols: 1
};


/* =====================================================
   2. 화면 상태
===================================================== */

function setMainStatus(message, type) {
  mainStatus.textContent = message;
  mainStatus.className = type || "wait";
}

function setDetailStatus(message) {
  detailStatus.textContent = message;
}

function showResultStatus() {
  setMainStatus("대기", "wait");
  setDetailStatus("QR 코드를 카메라에 비춰주세요.");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(ch) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[ch];
  });
}


/* =====================================================
   3. 작업자 이름 저장
===================================================== */

workerName.value = localStorage.getItem("kgmWorkerName") || "";

workerName.addEventListener("input", function() {
  localStorage.setItem("kgmWorkerName", workerName.value.trim());
});


/* =====================================================
   4. 인식 소리
   - 항상 사용
   - AudioContext 재사용
   - 사용자 터치로 오디오 활성화
===================================================== */

let audioContext = null;
let pendingBeep = false;

function createAudioContext() {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (AudioContextClass) {
      audioContext = new AudioContextClass();
    }
  }

  return audioContext;
}

async function unlockAudio() {
  const ctx = createAudioContext();

  if (!ctx) return;

  try {
    if (ctx.state !== "running") {
      await ctx.resume();
    }

    if (ctx.state === "running" && pendingBeep) {
      pendingBeep = false;
      playBeep();
    }
  } catch (error) {
    console.log("오디오 활성화 실패:", error);
  }
}

document.addEventListener("pointerdown", unlockAudio, {
  once: true,
  capture: true
});

document.addEventListener("touchstart", unlockAudio, {
  once: true,
  capture: true,
  passive: true
});

document.addEventListener("keydown", unlockAudio, {
  once: true,
  capture: true
});

function playBeep() {
  const ctx = createAudioContext();

  if (!ctx) return;

  if (ctx.state !== "running") {
    pendingBeep = true;

    ctx.resume().then(function() {
      if (ctx.state === "running" && pendingBeep) {
        pendingBeep = false;
        playBeep();
      }
    }).catch(function(error) {
      console.log("소리 재생 대기:", error);
    });

    return;
  }

  try {
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(1600, ctx.currentTime);

    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.015
    );
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.16
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(ctx.currentTime);
    oscillator.stop(ctx.currentTime + 0.17);

  } catch (error) {
    console.log("인식 소리 재생 오류:", error);
  }
}


/* =====================================================
   5. 카메라 해상도
===================================================== */

function getResolutionConstraints() {
  const width = Number(resolutionSelect.value);

  let height = 720;

  if (width === 1920) height = 1080;
  if (width === 2560) height = 1440;

  return {
    width: { ideal: width },
    height: { ideal: height },
    frameRate: { ideal: 30, max: 30 }
  };
}


/* =====================================================
   6. 카메라 장치 목록
   - 모든 비디오 카메라 장치 사용
   - 전면/후면 구분 없이 순차 전환
===================================================== */

async function enumerateCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();

  cameraList = devices.filter(function(device) {
    return device.kind === "videoinput";
  });

  return cameraList;
}

function getCurrentDeviceId() {
  if (!currentStream) return "";

  const track = currentStream.getVideoTracks()[0];

  if (!track) return "";

  return track.getSettings().deviceId || "";
}


/* =====================================================
   7. 현재 카메라 정지
===================================================== */

function stopCurrentCamera() {
  scanning = false;

  if (currentStream) {
    currentStream.getTracks().forEach(function(track) {
      track.stop();
    });
  }

  currentStream = null;

  video.pause();
  video.srcObject = null;
}


/* =====================================================
   8. 자동 초점
===================================================== */

async function applyContinuousFocus(track) {
  try {
    const capabilities = track.getCapabilities();

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes("continuous")
    ) {
      await track.applyConstraints({
        advanced: [{ focusMode: "continuous" }]
      });
    }
  } catch (error) {
    console.log("자동 초점 설정 미지원:", error);
  }
}


/* =====================================================
   9. 카메라 연결 보조 함수
===================================================== */

async function openCamera(constraints) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: constraints
  });

  const track = stream.getVideoTracks()[0];

  if (!track) {
    stream.getTracks().forEach(t => t.stop());
    throw new Error("카메라 영상 트랙을 가져오지 못했습니다.");
  }

  try {
    video.srcObject = stream;
    await video.play();
  } catch (error) {
    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    throw error;
  }

  currentStream = stream;

  await applyContinuousFocus(track);

  return stream;
}


/* =====================================================
   10. 최초 카메라 연결
   - 후면 카메라 우선
   - exact 실패 시 ideal 재시도
   - 연결 후 전체 카메라 목록 확인
===================================================== */

async function startCameraSelection() {
  if (cameraStarting) return;

  cameraStarting = true;
  switchCameraBtn.disabled = true;

  stopCurrentCamera();

  setMainStatus("카메라 연결 중", "wait");
  setDetailStatus("후면 카메라를 우선 연결하고 있습니다.");

  try {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error("현재 브라우저에서 카메라를 사용할 수 없습니다.");
    }

    const resolution = getResolutionConstraints();

    // 1차: 후면 카메라 지정
    try {
      await openCamera({
        facingMode: { exact: "environment" },
        ...resolution
      });

    } catch (exactError) {
      console.log("후면 카메라 exact 연결 실패:", exactError);

      // 2차: 후면 카메라 우선 요청
      await openCamera({
        facingMode: { ideal: "environment" },
        ...resolution
      });
    }

    await enumerateCameras();

    const currentId = getCurrentDeviceId();

    currentCameraIndex = cameraList.findIndex(function(device) {
      return device.deviceId === currentId;
    });

    scanning = true;

    setMainStatus("대기", "wait");
    setDetailStatus(
      "카메라 연결 완료. 등록된 카메라 " +
      cameraList.length + "개"
    );

    scanLoop();

  } catch (error) {
    console.error("카메라 연결 오류:", error);

    stopCurrentCamera();

    setMainStatus("카메라 연결 실패", "error");
    setDetailStatus(
      error.message || "카메라 권한 및 브라우저 설정을 확인해주세요."
    );

  } finally {
    cameraStarting = false;
    switchCameraBtn.disabled = false;
  }
}


/* =====================================================
   11. 수동 카메라 전환
   - 전면/후면 모든 카메라 순차 전환
   - deviceId 기준
===================================================== */

async function changeCamera() {
  if (cameraChanging || cameraStarting) return;

  cameraChanging = true;
  switchCameraBtn.disabled = true;

  const oldDeviceId = getCurrentDeviceId();

  setMainStatus("카메라 전환 중", "wait");
  setDetailStatus("다음 카메라를 연결하고 있습니다.");

  try {
    await enumerateCameras();

    if (cameraList.length <= 1) {
      throw new Error("전환할 수 있는 다른 카메라가 없습니다.");
    }

    let oldIndex = cameraList.findIndex(function(device) {
      return device.deviceId === oldDeviceId;
    });

    if (oldIndex < 0) oldIndex = currentCameraIndex;
    if (oldIndex < 0) oldIndex = 0;

    const nextIndex = (oldIndex + 1) % cameraList.length;
    const nextCamera = cameraList[nextIndex];

    stopCurrentCamera();

    await new Promise(resolve => setTimeout(resolve, 500));

    await openCamera({
      deviceId: { exact: nextCamera.deviceId },
      ...getResolutionConstraints()
    });

    currentCameraIndex = nextIndex;

    scanning = true;

    setMainStatus("대기", "wait");
    setDetailStatus(
      "카메라 전환 완료 (" +
      (nextIndex + 1) + "/" + cameraList.length + "): " +
      (nextCamera.label || "카메라")
    );

    scanLoop();

  } catch (error) {
    console.error("카메라 전환 오류:", error);

    stopCurrentCamera();

    setMainStatus("카메라 전환 실패", "error");
    setDetailStatus(
      error.message || "카메라를 전환하지 못했습니다."
    );

    // 실패 시 기존 카메라 복구
    if (oldDeviceId) {
      try {
        await new Promise(resolve => setTimeout(resolve, 500));

        await openCamera({
          deviceId: { exact: oldDeviceId },
          ...getResolutionConstraints()
        });

        await enumerateCameras();

        currentCameraIndex = cameraList.findIndex(function(device) {
          return device.deviceId === oldDeviceId;
        });

        scanning = true;

        setMainStatus("대기", "wait");
        setDetailStatus("전환 실패. 기존 카메라로 복구했습니다.");

        scanLoop();

      } catch (restoreError) {
        console.error("기존 카메라 복구 실패:", restoreError);

        setMainStatus("카메라 연결 실패", "error");
        setDetailStatus("페이지를 새로고침한 후 다시 시도해주세요.");
      }
    }

  } finally {
    cameraChanging = false;
    switchCameraBtn.disabled = false;
  }
}

switchCameraBtn.addEventListener("click", changeCamera);


/* =====================================================
   12. QR 이미지 전처리
   - 원본
   - 명암 보정
   - 반전
   - 중앙 확대
===================================================== */

function makeImageVariants(source, width, height) {
  const variants = [];

  const baseCanvas = document.createElement("canvas");
  baseCanvas.width = width;
  baseCanvas.height = height;

  const baseContext = baseCanvas.getContext("2d", {
    willReadFrequently: true
  });

  baseContext.drawImage(source, 0, 0, width, height);
  variants.push(baseCanvas);

  // 명암 보정
  const contrastCanvas = document.createElement("canvas");
  contrastCanvas.width = width;
  contrastCanvas.height = height;

  const contrastContext = contrastCanvas.getContext("2d", {
    willReadFrequently: true
  });

  contrastContext.drawImage(baseCanvas, 0, 0);

  const imageData = contrastContext.getImageData(0, 0, width, height);
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      data[i + c] = Math.max(
        0,
        Math.min(255, (data[i + c] - 128) * 1.35 + 128)
      );
    }
  }

  contrastContext.putImageData(imageData, 0, 0);
  variants.push(contrastCanvas);

  // 반전
  const invertCanvas = document.createElement("canvas");
  invertCanvas.width = width;
  invertCanvas.height = height;

  const invertContext = invertCanvas.getContext("2d", {
    willReadFrequently: true
  });

  invertContext.drawImage(contrastCanvas, 0, 0);

  const invertData = invertContext.getImageData(0, 0, width, height);
  const invertPixels = invertData.data;

  for (let i = 0; i < invertPixels.length; i += 4) {
    invertPixels[i] = 255 - invertPixels[i];
    invertPixels[i + 1] = 255 - invertPixels[i + 1];
    invertPixels[i + 2] = 255 - invertPixels[i + 2];
  }

  invertContext.putImageData(invertData, 0, 0);
  variants.push(invertCanvas);

  // 중앙 72% 영역 확대
  const cropCanvas = document.createElement("canvas");
  cropCanvas.width = Math.round(width * 1.5);
  cropCanvas.height = Math.round(height * 1.5);

  const cropContext = cropCanvas.getContext("2d", {
    willReadFrequently: true
  });

  const cropWidth = width * 0.72;
  const cropHeight = height * 0.72;
  const cropX = (width - cropWidth) / 2;
  const cropY = (height - cropHeight) / 2;

  cropContext.drawImage(
    contrastCanvas,
    cropX, cropY, cropWidth, cropHeight,
    0, 0, cropCanvas.width, cropCanvas.height
  );

  variants.push(cropCanvas);

  return variants;
}


/* =====================================================
   13. QR 인식
   - BarcodeDetector 우선
   - ZXing-WASM 보조
===================================================== */

async function decodeCanvas(canvas) {
  if (barcodeDetectorAvailable && barcodeDetector) {
    try {
      const results = await barcodeDetector.detect(canvas);

      if (results && results.length > 0 && results[0].rawValue) {
        return results[0].rawValue;
      }
    } catch (error) {
      console.log("BarcodeDetector 인식 실패:", error);
    }
  }

  try {
    if (
      !window.ZXingWASM ||
      typeof window.ZXingWASM.readBarcodes !== "function"
    ) {
      return null;
    }

    const context = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const imageData = context.getImageData(
      0, 0, canvas.width, canvas.height
    );

    const results = await window.ZXingWASM.readBarcodes(
      imageData,
      ZXING_OPTIONS
    );

    if (results && results.length > 0 && results[0].text) {
      return results[0].text;
    }

  } catch (error) {
    console.log("ZXing 인식 실패:", error);
  }

  return null;
}

async function decodeSource(source, width, height) {
  const variants = makeImageVariants(source, width, height);

  for (const canvas of variants) {
    const result = await decodeCanvas(canvas);

    if (result) return result;
  }

  return null;
}


/* =====================================================
   14. 카메라 스캔 반복
===================================================== */

async function scanLoop() {
  if (!scanning || !currentStream) return;

  if (processing) {
    requestAnimationFrame(scanLoop);
    return;
  }

  if (!video.videoWidth || !video.videoHeight) {
    requestAnimationFrame(scanLoop);
    return;
  }

  const now = Date.now();

  if (now - lastScanLoopTime < 180) {
    requestAnimationFrame(scanLoop);
    return;
  }

  lastScanLoopTime = now;

  try {
    const width = video.videoWidth;
    const height = video.videoHeight;

    scanCanvas.width = width;
    scanCanvas.height = height;

    const context = scanCanvas.getContext("2d", {
      willReadFrequently: true
    });

    context.drawImage(video, 0, 0, width, height);

    const decodedText = await decodeSource(
      scanCanvas,
      width,
      height
    );

    if (decodedText) {
      await processDecodedText(decodedText);
    }

  } catch (error) {
    console.log("스캔 처리 오류:", error);
  }

  if (scanning) {
    requestAnimationFrame(scanLoop);
  }
}


/* =====================================================
   15. 추출 데이터 처리
   - 고정 위치 기준
   - 51번째부터 62번째 문자
   - 총 12자리
   - 시작 문자는 제한하지 않음
===================================================== */

function extractBatteryData(text) {
  const source = String(text);

  if (source.length < 62) {
    return "";
  }

  return source.substring(50, 62);
}


/* =====================================================
   16. 최근 처리 결과 표시
===================================================== */

function showRecentResult(text, extracted) {
  const now = new Date();

  const timeText =
    now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0") + " " +
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0") + ":" +
    String(now.getSeconds()).padStart(2, "0");

  recentResult.innerHTML =
    "<strong>최근 처리 결과</strong><br>" +
    "처리 시간: " + timeText + "<br>" +
    "추출 데이터: <strong>" +
    escapeHtml(extracted || "추출 실패 (문자열 길이 부족)") +
    "</strong>";
}


/* =====================================================
   17. QR 인식 후 처리
===================================================== */

async function processDecodedText(text) {
  if (processing) return;

  const now = Date.now();

  // 동일 QR 중복 처리 방지
  if (text === lastText && now - lastScanTime < 3000) {
    return;
  }

  lastText = text;
  lastScanTime = now;

  processing = true;

  // QR 인식 즉시 소리 재생
  playBeep();

  const extracted = extractBatteryData(text);

  showRecentResult(text, extracted);

  if (!extracted) {
    setMainStatus("데이터 추출 실패", "error");
    setDetailStatus("QR 문자열 길이가 62자보다 짧습니다.");

    setTimeout(function() {
      processing = false;
      showResultStatus();
    }, 1000);

    return;
  }

  setMainStatus("전송 중", "sending");
  setDetailStatus("QR 데이터를 구글 스프레드시트로 전송하고 있습니다.");

  try {
    await sendToSheet(text);

    setMainStatus("전송 완료", "done");
    setDetailStatus("전송 요청이 완료되었습니다.");

  } catch (error) {
    console.error("전송 오류:", error);

    setMainStatus("전송 실패", "error");
    setDetailStatus(error.message || "네트워크 연결을 확인해주세요.");
  }

  setTimeout(function() {
    processing = false;
    showResultStatus();
  }, 1000);
}


/* =====================================================
   18. 구글 스프레드시트 전송
===================================================== */

async function sendToSheet(text) {
  const name = workerName.value.trim();

  if (!name) {
    throw new Error("작업자 이름을 입력해주세요.");
  }

  const payload = {
    token: TOKEN,
    text: text,
    name: name
  };

  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

  return true;
}


/* =====================================================
   19. 사진으로 QR 인식
===================================================== */

photoBtn.addEventListener("click", function() {
  photoInput.click();
});

photoInput.addEventListener("change", async function(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (processing) {
    alert("현재 QR 데이터 처리 중입니다. 잠시 후 다시 시도해주세요.");
    photoInput.value = "";
    return;
  }

  setMainStatus("사진 분석 중", "sending");
  setDetailStatus("선택한 사진에서 QR 코드를 찾고 있습니다.");

  try {
    const imageBitmap = await createImageBitmap(file);

    const result = await decodeSource(
      imageBitmap,
      imageBitmap.width,
      imageBitmap.height
    );

    imageBitmap.close();

    if (result) {
      await processDecodedText(result);
    } else {
      setMainStatus("QR 인식 실패", "error");
      setDetailStatus("사진에서 QR 코드를 찾지 못했습니다.");
    }

  } catch (error) {
    console.error("사진 QR 인식 오류:", error);

    setMainStatus("사진 분석 실패", "error");
    setDetailStatus("이미지 파일을 확인해주세요.");

  } finally {
    photoInput.value = "";
  }
});


/* =====================================================
   20. 해상도 변경
===================================================== */

resolutionSelect.addEventListener("change", async function() {
  if (cameraStarting || cameraChanging) return;

  setDetailStatus("해상도 변경을 위해 카메라를 다시 연결합니다.");

  await startCameraSelection();
});


/* =====================================================
   21. 초기 실행
===================================================== */

async function initializeScanner() {
  setMainStatus("카메라 연결 준비 중", "wait");
  setDetailStatus("QR 인식 기능을 준비하고 있습니다.");

  if ("BarcodeDetector" in window) {
    try {
      const formats = await BarcodeDetector.getSupportedFormats();

      if (formats.includes("qr_code")) {
        barcodeDetector = new BarcodeDetector({
          formats: ["qr_code"]
        });

        barcodeDetectorAvailable = true;
      }
    } catch (error) {
      console.log("BarcodeDetector 초기화 실패:", error);
    }
  }

  if (
    !window.ZXingWASM ||
    typeof window.ZXingWASM.readBarcodes !== "function"
  ) {
    console.warn("ZXing-WASM 초기화 실패");
  }

  await startCameraSelection();
}

window.addEventListener("load", initializeScanner);

window.addEventListener("beforeunload", function() {
  stopCurrentCamera();

  if (audioContext && audioContext.state !== "closed") {
    audioContext.close();
  }
});
